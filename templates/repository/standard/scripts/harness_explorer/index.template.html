  <style>
/* Modernist — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #ec3013;
  --color-accent-2: #e15b47;
  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #fff2ef;
  --color-accent-200: #ffe0d9;
  --color-accent-300: #ffc4b8;
  --color-accent-400: #ff9783;
  --color-accent-500: #ff563c;
  --color-accent-600: #dd2b0f;
  --color-accent-700: #ae1800;
  --color-accent-800: #7c1405;
  --color-accent-900: #4d170e;

  --color-accent-2-100: #fff2ef;
  --color-accent-2-200: #ffe0da;
  --color-accent-2-300: #ffc4b9;
  --color-accent-2-400: #ff9784;
  --color-accent-2-500: #ef6853;
  --color-accent-2-600: #c94b39;
  --color-accent-2-700: #9e3526;
  --color-accent-2-800: #71261b;
  --color-accent-2-900: #471d16;

  --font-heading: "Archivo", system-ui, sans-serif;
  --font-heading-weight: 800;
  --font-body: "Archivo", system-ui, sans-serif;

  --space-1: 4.0px;
  --space-2: 8.0px;
  --space-3: 12.0px;
  --space-4: 16.0px;
  --space-6: 24.0px;
  --space-8: 32.0px;

  --radius-sm: 0px;
  --radius-md: 0px;
  --radius-lg: 0px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.grayscale{filter:grayscale(1) contrast(1.08)}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 2px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: 2px solid var(--color-divider);
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid var(--color-divider);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }
:root{
      --l-bg:#f3f2f2;--l-surface:#f8f4f4;--l-fg:#201e1d;--l-muted:#605d5d;--l-faint:#9b9797;
      --l-border:#d7d3d3;--l-rule:#201e1d;--l-accent:#ec3013;--l-accent-deep:#ae1800;--l-soft:#ffe0d9;
      --l-mono:ui-monospace,"SFMono-Regular",Consolas,"Liberation Mono",monospace;
      --s-rejected:#ae1800;--s-superseded:#9b9797;
    }
    html,body{margin:0;background:var(--l-bg);color:var(--l-fg)}
    a{color:var(--l-accent-deep)}a:hover{color:var(--l-accent)}
    button{font:inherit;border-radius:0}
    :focus-visible{outline:2px solid var(--l-accent);outline-offset:2px}
    ::selection{background:var(--color-accent-200);color:var(--color-accent-900)}
    @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* Shell surfaces and the Readiness view, on the designed views' tokens. */
.hx-fallback[hidden]{display:none}
.hx-fallback{margin:24px auto;max-width:720px;padding:18px 20px;border:1px solid var(--l-border,#d7d3d3);background:var(--l-surface,#f8f4f4);color:var(--l-fg,#201e1d);font:14px/1.5 var(--font-body,system-ui,sans-serif);display:grid;gap:8px}
.hx-page{min-height:100vh;display:flex;font-family:var(--font-body,system-ui,sans-serif);background:var(--l-bg);color:var(--l-fg)}
.hx-nav{width:170px;flex:0 0 auto;border-right:2px solid var(--l-rule);background:var(--l-surface);position:sticky;top:0;align-self:flex-start;min-height:100vh;padding:18px 0}
.hx-brand{display:flex;align-items:center;gap:8px;padding:0 16px 16px}
.hx-brand-mark{width:12px;height:12px;background:var(--l-accent);flex:none}
.hx-brand-name{font-family:var(--font-heading,inherit);font-weight:800;font-size:13px}
.hx-nav a{display:block;padding:10px 16px;border-left:3px solid transparent;font:600 13px var(--font-body,inherit);color:var(--l-fg);text-decoration:none;white-space:nowrap;overflow:hidden}
.hx-nav a:hover{background:var(--l-soft);color:var(--l-accent-deep)}
.hx-nav a[aria-current=page]{border-left-color:var(--l-accent);background:var(--l-soft);font-weight:700;color:var(--l-accent-deep)}
.hx-main{flex:1;min-width:0;padding:28px clamp(18px,3vw,38px) 44px;display:grid;gap:16px;align-content:start}
.hx-kicker{margin:0 0 4px;color:var(--l-muted);font:10px var(--l-mono);letter-spacing:.08em;text-transform:uppercase}
.hx-title{margin:0;font-family:var(--font-heading,inherit);font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.02em}
.hx-lead{margin:0;max-width:760px;color:var(--l-muted);font-size:14px;line-height:1.5}
.hx-panel{background:var(--l-surface);border:1px solid var(--l-border);padding:18px 20px;min-width:0}
.hx-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.hx-head h2{margin:0;font-size:18px;font-family:var(--font-heading,inherit)}
.hx-head>span{color:var(--l-muted);font:10px var(--l-mono);letter-spacing:.06em}
.hx-note{margin:0 0 12px;color:var(--l-muted);font-size:12.5px;line-height:1.5}
.hx-note code{font:11px var(--l-mono)}
.hx-two{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.7fr);gap:16px}
.hx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0}
.hx-grid dt{color:var(--l-muted);font:10px var(--l-mono);text-transform:uppercase;letter-spacing:.06em}
.hx-grid dd{margin:4px 0 0;font-size:13px;line-height:1.45;overflow-wrap:anywhere}
.hx-mono{font-family:var(--l-mono);font-size:12px;overflow-wrap:anywhere}
.hx-link{min-height:32px;border:0;background:transparent;padding:0;font:700 13px var(--font-body,inherit);color:var(--l-fg);cursor:pointer;text-align:left}
.hx-link:hover{color:var(--l-accent-deep)}
.hx-ref{color:var(--l-fg);font:700 12px var(--l-mono);text-decoration:none;border-bottom:1px solid var(--l-border)}
.hx-ref:hover{color:var(--l-accent-deep);border-bottom-color:var(--l-accent)}
.hx-badge{display:inline-block;padding:4px 8px;background:var(--l-soft);color:var(--l-accent-deep);font:10px var(--l-mono);letter-spacing:.04em;vertical-align:middle}
.hx-badge.warning{background:var(--l-soft);color:var(--l-accent-deep);border:1px solid var(--l-accent)}
.hx-evidence{border-left:3px solid var(--l-border);background:transparent;color:var(--l-fg)}
.hx-evidence.clear{border-color:#2f8f5b}
.hx-evidence.review{border-color:#c98a1a}
.hx-evidence.blocked{border-color:var(--l-accent)}
.hx-table{width:100%;border-collapse:collapse}
.hx-table th,.hx-table td{padding:11px 9px;border-bottom:1px solid var(--l-border);text-align:left;vertical-align:top;font-size:12.5px}
.hx-table th{color:var(--l-muted);font:9px var(--l-mono);text-transform:uppercase;letter-spacing:.06em}
.hx-table small{color:var(--l-muted);display:block;margin-top:3px}
.hx-gate-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--l-border);background:var(--l-bg)}
.hx-gate-figure{padding:14px;border-right:1px solid var(--l-border);display:grid;gap:6px;align-content:start}
.hx-gate-figure:last-child{border-right:0}
.hx-gate-figure[data-gate-active=true]{box-shadow:inset 0 -3px 0 var(--l-accent)}
.hx-gate-code{color:var(--l-muted);font:10px var(--l-mono);letter-spacing:.06em}
.hx-gate-figure strong{font-size:12.5px;line-height:1.3}
.hx-gate-total,.hx-gate-state{border:1px solid var(--l-border);background:var(--l-surface);color:var(--l-fg);cursor:pointer;font:700 12px var(--l-mono);padding:4px 6px;text-align:left}
.hx-gate-total[aria-pressed=true],.hx-gate-state[aria-pressed=true]{border-color:var(--l-accent);color:var(--l-accent-deep);background:var(--l-soft)}
.hx-gate-states{display:flex;flex-wrap:wrap;gap:4px}
.hx-gate-state{font-weight:600;font-size:11px}
.hx-posture{display:flex;height:6px;background:var(--l-border);margin:4px 0}
.hx-posture .is-satisfied{background:#2f8f5b}
.hx-posture .is-unsatisfied{background:var(--l-accent)}
.hx-posture .is-unknown{background:#c98a1a}
.hx-selection{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 8px;font-size:12.5px;flex-wrap:wrap}
.hx-back{margin-bottom:-6px}
.hx-gates{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--l-border);background:var(--l-bg)}
.hx-gate{padding:14px;border-right:1px solid var(--l-border);border-bottom:3px solid #2f8f5b;display:grid;gap:6px;align-content:start}
.hx-gate:last-child{border-right:0}
.hx-gate.review{border-bottom-color:#c98a1a}
.hx-gate.blocked{border-bottom-color:var(--l-accent)}
.hx-gate span:last-child{color:var(--l-muted);font-size:11.5px;line-height:1.4}
.hx-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hx-filters button{border:1px solid var(--l-border);background:var(--l-surface);color:var(--l-fg);padding:5px 10px;font:600 11.5px var(--font-body,inherit);cursor:pointer}
.hx-filters button[aria-pressed=true]{border-color:var(--l-accent);background:var(--l-soft);color:var(--l-accent-deep)}
.hx-finding{padding:12px 0;border-top:1px solid var(--l-border)}
.hx-finding:first-of-type{border-top:0}
.hx-finding p{margin:6px 0 0;color:var(--l-muted);font-size:12.5px;line-height:1.45}
.hx-finding .hx-badge{float:right}
.hx-records{display:grid}
.hx-record{padding:11px 0;border-top:1px solid var(--l-border);display:grid;gap:3px}
.hx-record:first-child{border-top:0}
.hx-record small{color:var(--l-muted);overflow-wrap:anywhere;font-size:12px;line-height:1.45}
.hx-select{display:grid;gap:5px;min-width:min(320px,42vw);color:var(--l-muted);font:9px var(--l-mono);text-transform:uppercase}
.hx-select select{min-height:38px;border:1px solid var(--l-border);background:var(--l-surface);color:var(--l-fg);padding:0 10px;font:13px var(--font-body,inherit)}
@media (max-width:900px){.hx-two,.hx-grid{grid-template-columns:1fr}.hx-gates{grid-template-columns:repeat(2,minmax(0,1fr))}.hx-nav{width:54px}.hx-nav a,.hx-brand-name{font-size:0}.hx-nav a::first-letter{font-size:13px}.hx-table th:nth-child(2),.hx-table td:nth-child(2){display:none}}
  </style>
</head>

<script>
/* Harness Explorer shell runtime.
 *
 * Owns everything the designed view components must not: reading the
 * embedded bootstrap, fetching and integrity-verifying manifest-declared
 * resources, flattening the verified summary and topology into the bundle
 * shape the views consume, query-string routing between views, in-memory
 * reader preferences, and the Readiness view. Repository text only ever
 * reaches the DOM through textContent or escaped interpolation here.
 */

e.decided_by).length;\n    const roles = m ? { ...(m.decided_by || {}) } : {};\n    if (!m) eventList.forEach(e =\u003e { if (e.decided_by) roles[e.decided_by] = (roles[e.decided_by] || 0) + 1; });\n    const roleRows = Object.keys(roles).sort((a, z) =\u003e roles[z] - roles[a] || a.localeCompare(z));\n    const maxRole = roleRows.length ? roles[roleRows[0]] : 1;\n    const delegT = m ? m.delegated_transitions : eventList.filter(e =\u003e String(e.decided_by || '').includes('delegated')).length;\n    const delegRec = m ? m.delegated_records : details.filter(a =\u003e String(a.prepared_by || '').includes('delegated')).length;\n    const delegIds = m ? (m.delegated_artifacts || []) : [...new Set([...eventList.filter(e =\u003e String(e.decided_by || '').includes('delegated')).map(e =\u003e e.artifact), ...details.filter(a =\u003e String(a.prepared_by || '').includes('delegated')).map(a =\u003e a.id)])];\n    const rejectedInScope = b.artifacts.filter(a =\u003e a.status === 'rejected').map(a =\u003e a.id);\n    const supersededInScope = b.artifacts.filter(a =\u003e a.status === 'superseded').map(a =\u003e a.id);\n    // commit-bound qualifier: every released WO carries a verified record\n    const out = new Map(), inn = new Map();\n    b.relations.forEach(r =\u003e {\n      if (!out.has(r.source)) out.set(r.source, []); out.get(r.source).push(r);\n      if (!inn.has(r.target)) inn.set(r.target, []); inn.get(r.target).push(r);\n    });\n    const releasedWos = b.artifacts.filter(a =\u003e a.type === 'release_record' \u0026\u0026 a.status === 'released')\n      .flatMap(a =\u003e (out.get(a.id) || []).filter(r =\u003e r.relation === 'releases_work').map(r =\u003e r.target));\n    const coveredWos = releasedWos.filter(w =\u003e (inn.get(w) || []).some(r =\u003e r.relation === 'verifies_work_order'));\n    vals.account = [\n      {\n        kicker: 'Decisions recorded, all attributed',\n        fig: events.length + ' events · ' + unattributed + ' unattributed',\n        sub ;border-left:3px solid transparent;font:600 13px var(--font-body);color:var(--l-fg);text-decoration:none;white-space:nowrap;overflow:hidden\" style-hover=\"background:var(--l-soft);color:var(--l-accent-deep)\"\u003e{{readinessLabel}}\u003c/a\u003e\n    \u003cbutton onClick=\"{{toggleNav}}\" aria-label=\"{{navBtnAria}}\" title=\"{{navBtnAria}}\" style=\"margin:16px 16px 0;min-height:30px;padding:0 8px;border:1px solid var(--l-border);background:transparent;color:var(--l-muted);cursor:pointer;font:700 11px var(--l-mono)\" style-hover=\"border-color:var(--l-accent);color:var(--l-accent-deep)\"\u003e{{navBtnLabel}}\u003c/button\u003e\n  \u003c/nav\u003e\n  \u003cdiv style=\"flex:1;min-width:0;display:flex;flex-direction:column\"\u003e\n  \u003cheader style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding:18px 24px 14px;border-bottom:2px solid var(--l-rule)\"\u003e\n    \u003cdiv style=\"min-width:0\"\u003e\n      \u003cdiv style=\"display:flex;align-items:center;gap:10px\"\u003e\n        \u003cspan style=\"width:14px;height:14px;background:var(--l-accent);flex:none\"\u003e\u003c/span\u003e\n        \u003cspan style=\"font-family:var(--font-heading);font-weight:800;font-size:17px;letter-spacing:-.01em\"\u003eVERITYPLANE\u003c/span\u003e\n        \u003cspan style=\"font-family:var(--font-heading);font-weight:800;font-size:17px;color:var(--l-muted)\"\u003e/ LINEAGE\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cp style=\"margin:5px 0 0 24px;font:11px var(--l-mono);color:var(--l-muted)\"\u003e{{countsLine}}\u003c/p\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\"\u003e\n      \u003csc-if value=\"{{hasSelection}}\" hint-placeholder-val=\"{{false}}\"\u003e\n        \u003cbutton onClick=\"{{clearSelection}}\" style=\"min-height:40px;padding:0 14px;border:1px solid var(--l-rule);background:transparent;color:var(--l-fg);cursor:pointer;font-size:13px;font-weight:600 placeholder-count=\"8\"\u003e\n      \u003cspan style=\"display:inline-flex;align-items:center;gap:6px\"\u003e\u003ci style=\"{{s.dot}}\"\u003e\u003c/i\u003e{{s.label}}\u003c/span\u003e\n    \u003c/sc-for\u003e\n    \u003cspan style=\"border-left:1px solid var(--l-border);padding-left:18px\"\u003eWO work order · VREC verification record · RLS release record · REL release contract · ADR architecture decision — hover any card for its plain-language gloss\u003c/span\u003e\n  \u003c/div\u003e\n  \u003csc-if value=\"{{hasHistory}}\" hint-placeholder-val=\"{{false}}\"\u003e\n    \u003cdiv style=\"display:flex;align-items:center;gap:8px;padding:8px 24px;border-bottom:1px solid var(--l-border);overflow-x:auto\"\u003e\n      \u003cbutton onClick=\"{{histBack}}\" disabled=\"{{backDisabled}}\" aria-label=\"Previous visited artifact\" style=\"min-height:32px;padding:0 10px;border:1px solid var(--l-border);background:var(--l-surface);color:var(--l-fg);cursor:pointer;font:12px var(--l-mono)\"\u003e←\u003c/button\u003e\n      \u003cbutton onClick=\"{{histFwd}}\" disabled=\"{{fwdDisabled}}\" aria-label=\"Next visited artifact\" style=\"min-height:32px;padding:0 10px;border:1px solid var(--l-border);background:var(--l-surface);color:var(--l-fg);cursor:pointer;font:12px var(--l-mono)\"\u003e→\u003c/button\u003e\n      \u003cspan style=\"font:10px var(--l-mono);color:var(--l-faint);text-transform:uppercase;letter-spacing:.06em;flex:none\"\u003eVisited\u003c/span\u003e\n      \u003cdiv style=\"display:flex;gap:6px\"\u003e\n        \u003csc-for list=\"{{histItems}}\" as=\"h\" hint-placeholder-count=\"0\"\u003e\n          \u003cbutton onClick=\"{{h.onClick}}\" aria-current=\"{{h.current}}\" style=\"{{h.style}}\"\u003e{{h.id}}\u003c/button\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n  \u003c/sc-if\u003e\n  \u003csc-if value=\"{{loading}}\" hint-placeholder-val=\"{{true}}\"\u003e\n    \u003cdiv style=\"padding:60px 24px;font:12px var(--l-mono);color:va {boardW}}\" height=\"{{boardH}}\" aria-hidden=\"true\" style=\"position:absolute;inset:0;pointer-events:none;overflow:visible\"\u003e\n            \u003cdefs\u003e\n              \u003cmarker id=\"lin-arrow\" markerWidth=\"7\" markerHeight=\"7\" refX=\"6\" refY=\"3.5\" orient=\"auto\"\u003e\u003cpath d=\"M0 0L7 3.5 0 7z\" fill=\"context-stroke\"\u003e\u003c/path\u003e\u003c/marker\u003e\n            \u003c/defs\u003e\n            \u003csc-for list=\"{{edges}}\" as=\"e\" hint-placeholder-count=\"0\"\u003e\n              \u003cg opacity=\"{{e.op}}\"\u003e\n                \u003cpath d=\"{{e.d}}\" fill=\"none\" stroke=\"{{e.stroke}}\" stroke-width=\"{{e.w}}\" stroke-dasharray=\"{{e.dash}}\" marker-end=\"url(#lin-arrow)\"\u003e\u003c/path\u003e\n                \u003ctext x=\"{{e.lx}}\" y=\"{{e.ly}}\" text-anchor=\"middle\" style=\"font:10px var(--l-mono);fill:var(--l-fg);paint-order:stroke;stroke:var(--l-bg);stroke-width:3px;stroke-linejoin:round\"\u003e{{e.verb}}\u003c/text\u003e\n              \u003c/g\u003e\n            \u003c/sc-for\u003e\n          \u003c/svg\u003e\n          \u003cdiv style=\"display:grid;grid-template-columns:repeat(6,264px);align-items:stretch\"\u003e\n            \u003csc-for list=\"{{stages}}\" as=\"st\" hint-placeholder-count=\"6\"\u003e\n              \u003csection data-screen-label=\"{{st.label}}\" style=\"border-right:1px solid var(--l-border);min-height:420px;padding-bottom:40px\"\u003e\n                \u003cheader style=\"position:sticky;top:0;z-index:10;background:var(--l-bg);border-bottom:2px solid var(--l-rule);padding:12px 14px 10px\"\u003e\n                  \u003cspan style=\"display:block;font:10px var(--l-mono);letter-spacing:.09em;color:var(--l-faint)\"\u003e{{st.num}}\u003c/span\u003e\n                  \u003cstrong style=\"display:block;font-family:var(--font-heading);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.02em\"\u003e{{st.label}}\u003c/strong\u003e\n                  \u003cspan style=\"{{st.
