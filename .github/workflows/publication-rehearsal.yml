# WO-KIS-005: one path decision selects both release rehearsal legs.
# Ordinary PRs retain candidate evidence and get an explicit successful skip here.
# Build inputs select candidate replay; publication inputs select both legs.
# Manual release preparation selects both. No publication credentials or writes.
# Trigger policy: pull requests, pushes to main, and explicit dispatch.
# See docs/notes/release-publication-rehearsal.md.
name: Publication Rehearsal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_record:
        description: Formal schema-2 release record to rehearse against (for example RLS-SEH-013), or empty to select the newest ready or released one
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publication-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select release rehearsals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_record: ${{ steps.select.outputs.release_record }}
      status: ${{ steps.select.outputs.status }}
      candidate: ${{ steps.select.outputs.candidate }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Select Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Fetch the comparison commit
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE_COMMIT" && ! "$BASE_COMMIT" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_COMMIT"
          fi

      - name: Select relevant rehearsals and the release record
        id: select
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/publish_release.py select-rehearsals \
            --repository "$GITHUB_WORKSPACE" \
            --release-record "$RELEASE_RECORD" \
            --event "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  rehearse-candidate:
    name: Rehearse the qualification of this candidate
    needs: select
    if: needs.select.outputs.candidate == 'true'
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
    with:
      mode: candidate
      ref: ${{ github.sha }}

  result:
    name: Publication rehearsal
    if: always()
    needs: [select, rehearse-candidate, rehearse-record]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Report selected checks or a successful skip
        env:
          SELECTION: ${{ needs.select.result }}
          CANDIDATE: ${{ needs.rehearse-candidate.result }}
          RECORD: ${{ needs.rehearse-record.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SELECTION" = success
          for result in "$CANDIDATE" "$RECORD"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
          echo "Candidate replay: $CANDIDATE; release-record rehearsal: $RECORD." >> "$GITHUB_STEP_SUMMARY"

  rehearse-record:
    name: Rehearse the qualification of the release record
    needs: select
    if: needs.select.outputs.release_record != ''
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
    with:
      mode: release-record
      release_record: ${{ needs.select.outputs.release_record }}
      require_status: ${{ needs.select.outputs.status }}
      default_ref: refs/remotes/origin/main
      ref: ${{ github.sha }}
