# Repository-owned pre-release rehearsal (WO-RLO-005, CAP-RLO-003; mechanism
# replaced under WO-CIP-002, ADR-CIP-001). It invokes the one release
# qualification definition, .github/workflows/release-qualification.yml, in
# candidate mode on every pull request and push to main, and in release-record
# mode against the newest schema-2 ready or released record when one exists or
# when dispatched with one. What is rehearsed is what the publication workflow
# executes, by construction; there is no copy to keep aligned and no digest to
# refresh. It holds no publication authority: no credential, no environment,
# no write permission, and no tag, release, index object, deployment, or
# formal lifecycle transition. Trigger policy (SPEC-CIP-001 CIP-TRG): pull
# requests and pushes to main; a newer push cancels the older run. Described
# in docs/notes/release-publication-rehearsal.md.
name: Publication Rehearsal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_record:
        description: Formal schema-2 release record to rehearse against (for example RLS-SEH-013), or empty to select the newest ready or released one
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publication-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select the release record to rehearse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_record: ${{ steps.select.outputs.release_record }}
      status: ${{ steps.select.outputs.status }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Select the newest schema-2 ready or released record, or the dispatched one
        id: select
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/publish_release.py select-rehearsal-record \
            --repository "$GITHUB_WORKSPACE" \
            --release-record "$RELEASE_RECORD" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  rehearse-candidate:
    name: Rehearse the qualification of this candidate
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
    with:
      mode: candidate
      ref: ${{ github.sha }}

  rehearse-record:
    name: Rehearse the qualification of the release record
    needs: select
    if: needs.select.outputs.release_record != ''
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
    with:
      mode: release-record
      release_record: ${{ needs.select.outputs.release_record }}
      require_status: ${{ needs.select.outputs.status }}
      default_ref: refs/remotes/origin/main
      ref: ${{ github.sha }}
