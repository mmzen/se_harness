name: Engineering Harness

on:
  pull_request:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate artifact graph
        run: python scripts/validate_engineering_artifacts.py --root .
      - name: Generate Harness Explorer
        run: python scripts/generate_harness_dashboard.py --root .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-dashboard
          path: target/harness-dashboard

