name: Engineering Harness

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  SE_HARNESS_VERSION: "0.5.0a1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the exact released evaluator
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/se-harness-env"
          "$RUNNER_TEMP/se-harness-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            "se-harness==$SE_HARNESS_VERSION"
      - name: Prove evaluator identity and isolation
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -c \
            "import os, pathlib, se_harness, sys; from se_harness.installer import template_root; boundary=pathlib.Path(sys.prefix).resolve(); checkout=pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve(); origins=(pathlib.Path(se_harness.__file__).resolve(), template_root().resolve()); assert se_harness.__version__ == '$SE_HARNESS_VERSION'; assert all(path.is_relative_to(boundary) and not path.is_relative_to(checkout) for path in origins); print({'role':'consumer-evaluator','version':se_harness.__version__,'module':str(origins[0]),'templates':str(origins[1])})"
      - name: Select the pull-request work order
        if: github.event_name == 'pull_request'
        id: work_order
        shell: bash
        run: |
          work_order="$("$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness \
            select-work-order --event "$GITHUB_EVENT_PATH")"
          printf 'work_order=%s\n' "$work_order" >> "$GITHUB_OUTPUT"
      - name: Review preflight
        if: github.event_name == 'pull_request'
        env:
          HARNESS_WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
        run: >-
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness preflight .
          --work-order "$HARNESS_WORK_ORDER" --phase review
      - name: Check installed harness and graph
        run: |
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness doctor .
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness validate .
      - name: Generate Harness Explorer
        run: |
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness dashboard .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-dashboard
          path: target/harness-dashboard
