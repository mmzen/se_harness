# Managed by SE Harness. Runs the exact released evaluator outside the checkout:
# work-order selection and review preflight on pull requests, then doctor,
# validate and the dashboard. The declarations are selected from the pull
# request's current body, read from the API during the run, so a corrected
# body needs a re-run, not a push. Trigger policy: pull requests, and pushes to
# main, release/** and candidate/** only; a newer push to the same ref cancels
# the older run.
name: Engineering Harness

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "candidate/**"

concurrency:
  group: engineering-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  SE_HARNESS_VERSION: "0.14.0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the exact released evaluator
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/se-harness-env"
          "$RUNNER_TEMP/se-harness-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps --only-binary=:all: \
            "se-harness==$SE_HARNESS_VERSION"
      - name: Read the live pull-request body
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # ECP-LPB-002, -003: the declarations are selected from the pull request
          # as it is now, not from the stored trigger snapshot, so a corrected
          # body is honoured by re-running this check without a new push.
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER" \
            > "$RUNNER_TEMP/pull-request.json"
          "$RUNNER_TEMP/se-harness-env/bin/python" - "$RUNNER_TEMP/pull-request.json" "$RUNNER_TEMP/live-event.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              pull_request = json.load(source)
          with open(sys.argv[2], "w", encoding="utf-8") as target:
              json.dump({"pull_request": {"body": pull_request.get("body")}}, target)
          PY
      - name: Select the pull-request work order
        if: github.event_name == 'pull_request'
        id: work_order
        shell: bash
        run: |
          work_order="$("$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness \
            select-work-order --event "$RUNNER_TEMP/live-event.json")"
          printf 'work_order=%s\n' "$work_order" >> "$GITHUB_OUTPUT"
      - name: Review preflight
        if: github.event_name == 'pull_request'
        env:
          HARNESS_WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
        run: >-
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness preflight .
          --work-order "$HARNESS_WORK_ORDER" --phase review
      - name: Enforce the work-order scope on the pull request's diff
        if: github.event_name == 'pull_request'
        env:
          HARNESS_WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
          HARNESS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          # ECP-SCP-006 to -009: the scope check runs on every pull request over the
          # diff Git reports, with the released evaluator from the lock, whatever the
          # work order's lifecycle state; the handoff check and the comparison of a
          # declared Harness-Restitution line run only while it is still being
          # implemented, and
          # neither a declared line nor a lifecycle state relaxes the scope verdict.
          git fetch --depth=1 origin "$HARNESS_BASE_SHA"
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness check . \
            --artifact "$HARNESS_WORK_ORDER" --checkpoint scope \
            --from-git "$HARNESS_BASE_SHA" --json \
            > "$RUNNER_TEMP/scope.json" || true
          in_progress="$("$RUNNER_TEMP/se-harness-env/bin/python" - "$RUNNER_TEMP/scope.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          outcome = result.get("operation", {}).get("outcome")
          failures = [
              predicate for gate in result.get("compliance", {}).get("gates", [])
              for predicate in gate.get("predicates", [])
              if predicate.get("id") == "QGP-G4I-PATHS" and predicate.get("status") != "pass"
          ]
          for predicate in failures:
              print(f"scope: {predicate.get('message', '')}", file=sys.stderr)
          if failures:
              sys.exit("The pull request's diff leaves the work order's declared scope.")
          if outcome != "completed":
              for blocker in result.get("restitution", {}).get("blocked_by", []):
                  print(f"blocked: {blocker}", file=sys.stderr)
              sys.exit(f"The scope check did not complete (outcome {outcome}).")
          states = result.get("restitution", {}).get("current_lifecycle_state", [])
          print("yes" if any(item.endswith(" is in_progress.") for item in states) else "no")
          PY
          )"
          declared="$("$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness \
            select-work-order --event "$RUNNER_TEMP/live-event.json" --field restitution-digest)"
          if [ "$in_progress" != "yes" ]; then
            if [ -n "$declared" ]; then
              echo "The pull request's diff is inside the declared scope; the declared Harness-Restitution $declared was bound at handoff and is not recomputed after completion."
            else
              echo "The pull request's diff is inside the declared scope; no restitution digest was declared."
            fi
          else
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness check . \
            --artifact "$HARNESS_WORK_ORDER" --checkpoint handoff \
            --from-git "$HARNESS_BASE_SHA" --json \
            > "$RUNNER_TEMP/restitution.json" || true
          "$RUNNER_TEMP/se-harness-env/bin/python" - "$RUNNER_TEMP/restitution.json" "$declared" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          declared = sys.argv[2]
          outcome = result.get("operation", {}).get("outcome")
          if outcome != "completed":
              for blocker in result.get("restitution", {}).get("blocked_by", []):
                  print(f"blocked: {blocker}", file=sys.stderr)
              sys.exit(f"The handoff check did not complete (outcome {outcome}).")
          recomputed = result.get("result_sha256", "")
          if declared and declared != recomputed:
              sys.exit(f"Declared Harness-Restitution {declared} does not match the recomputed result_sha256 {recomputed}.")
          print("The pull request's diff is inside the declared scope"
                + (" and the declared restitution digest matches." if declared else "; no restitution digest was declared."))
          PY
          fi
      - name: Qualify the root with its exact released evaluator
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness \
            qualify released-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/released-root-qualification.json" \
            --json
      - name: Generate Harness Explorer
        run: |
          "$RUNNER_TEMP/se-harness-env/bin/python" -I -m se_harness dashboard .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-dashboard
          path: |
            target/harness-dashboard
            ${{ runner.temp }}/released-root-qualification.json
