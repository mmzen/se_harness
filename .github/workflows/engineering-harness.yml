name: Engineering Harness Self-Hosting

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  GOVERNOR_VERSION: "0.2.1"
  GOVERNOR_TAG: "v0.2.1"
  GOVERNOR_WHEEL: "se_harness-0.2.1-py3-none-any.whl"
  GOVERNOR_URL: "https://github.com/mmzen/se_harness/releases/download/v0.2.1/se_harness-0.2.1-py3-none-any.whl"
  GOVERNOR_WHEEL_SHA256: "533f6f87f5a1060d5d0070702969f643525ca3b91e2ecdbbd029f1530d093454"
  CANDIDATE_VERSION: "0.2.2"

jobs:
  governor:
    name: Released governor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the declared governor descriptor
        shell: bash
        run: |
          python -I -c "import pathlib, tomllib; value=tomllib.loads(pathlib.Path('.self-hosting/governor.toml').read_text()); assert value['version'] == '$GOVERNOR_VERSION'; assert value['tag'] == '$GOVERNOR_TAG'; assert value['wheel'] == '$GOVERNOR_WHEEL'; assert value['url'] == '$GOVERNOR_URL'; assert value['sha256'] == '$GOVERNOR_WHEEL_SHA256'"
      - name: Acquire the exact released governor
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/governor-env"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$GOVERNOR_WHEEL" \
            "$GOVERNOR_URL"
          printf '%s  %s\n' "$GOVERNOR_WHEEL_SHA256" "$RUNNER_TEMP/$GOVERNOR_WHEEL" |
            sha256sum --check -
          "$RUNNER_TEMP/governor-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$RUNNER_TEMP/$GOVERNOR_WHEEL"
      - name: Prove the installed governor identity
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/governor-env/bin/python" -I - "$GITHUB_WORKSPACE" \
            "$GOVERNOR_VERSION" "$GOVERNOR_WHEEL_SHA256" <<'PY'
          import importlib.metadata
          import json
          import pathlib
          import se_harness
          import sys
          from se_harness.installer import template_root

          checkout = pathlib.Path(sys.argv[1]).resolve()
          expected_version = sys.argv[2]
          wheel_sha256 = sys.argv[3]
          environment = pathlib.Path(sys.prefix).resolve()
          module = pathlib.Path(se_harness.__file__).resolve()
          distribution = pathlib.Path(importlib.metadata.distribution("se-harness").locate_file("")).resolve()
          templates = template_root().resolve()
          origins = (module, distribution, templates, pathlib.Path(sys.executable).resolve())
          assert se_harness.__version__ == expected_version
          assert all(path.is_relative_to(environment) for path in origins)
          assert all(not path.is_relative_to(checkout) for path in origins)
          assert all(not path.resolve().is_relative_to(checkout) for path in map(pathlib.Path, sys.path) if str(path))
          print(json.dumps({
              "role": "governor",
              "python_executable": sys.executable,
              "python_version": sys.version.split()[0],
              "harness_version": se_harness.__version__,
              "module_origin": str(module),
              "distribution_origin": str(distribution),
              "template_origin": str(templates),
              "expected_root": str(environment),
              "governor_wheel_sha256": wheel_sha256,
          }, sort_keys=True))
          PY
      - name: Prove governor same-version integrity in a disposable target
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/governor-env/bin/harnessctl" init "$RUNNER_TEMP/governor-target" \
            --project-name GovernorIntegrity
          "$RUNNER_TEMP/governor-env/bin/harnessctl" doctor "$RUNNER_TEMP/governor-target"
      - name: Check stable checkout facts without interpreting candidate semantics
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/governor-env/bin/python" -I - "$GITHUB_WORKSPACE" \
            "$CANDIDATE_VERSION" "$GOVERNOR_WHEEL_SHA256" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          checkout = pathlib.Path(sys.argv[1]).resolve()
          expected_candidate = sys.argv[2]
          expected_governor_hash = sys.argv[3]
          candidate = tomllib.loads((checkout / "pyproject.toml").read_text())
          governor = tomllib.loads((checkout / ".self-hosting/governor.toml").read_text())
          assert candidate["project"]["version"] == expected_candidate
          assert governor["sha256"] == expected_governor_hash
          excluded_failed_records = (
              "docs/engineering/release-0.2.2/verification-records/VREC-SEH-003.md",
              "docs/engineering/release-0.2.2/releases/RLS-SEH-003.md",
          )
          assert all(not (checkout / relative).exists() for relative in excluded_failed_records)
          print(json.dumps({
              "role": "governor",
              "compatibility_scope": "stable-bootstrap-facts",
              "candidate_version_observed": expected_candidate,
              "failed_pr_records_excluded": sorted(excluded_failed_records),
          }, sort_keys=True))
          PY
      - name: Prove the governor made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: released-governor-wheel
          path: ${{ runner.temp }}/${{ env.GOVERNOR_WHEEL }}
          if-no-files-found: error

  candidate-source:
    name: Candidate source
    needs: governor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove candidate-source identity
        shell: bash
        env:
          PYTHONNOUSERSITE: "1"
          PYTHONPATH: ""
        run: |
          python -m se_harness identity \
            --role candidate-source \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-root "$GITHUB_WORKSPACE" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA"
      - name: Select the pull-request work order
        if: github.event_name == 'pull_request'
        id: work_order
        shell: bash
        run: |
          work_order="$(python scripts/select_harness_work_order.py --event "$GITHUB_EVENT_PATH")"
          printf 'work_order=%s\n' "$work_order" >> "$GITHUB_OUTPUT"
      - name: Review preflight
        if: github.event_name == 'pull_request'
        env:
          HARNESS_WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
        run: python -m se_harness preflight . --work-order "$HARNESS_WORK_ORDER" --phase review
      - name: Run candidate-source regression
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate candidate artifact graph
        run: python scripts/validate_engineering_artifacts.py --root .
      - name: Exercise candidate doctor in a disposable target
        shell: bash
        run: |
          python -m se_harness init "$RUNNER_TEMP/candidate-source-target" \
            --project-name CandidateSource
          python -m se_harness doctor "$RUNNER_TEMP/candidate-source-target"
      - name: Generate candidate Harness Explorer
        run: python scripts/generate_harness_dashboard.py --root .
      - name: Prove candidate derived output is bounded
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-source-harness-dashboard
          path: target/harness-dashboard

  candidate-package:
    name: Candidate package
    needs: candidate-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: released-governor-wheel
          path: ${{ runner.temp }}/governor-dist
      - name: Export and build a non-promotable candidate wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-export" "$RUNNER_TEMP/candidate-dist"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/candidate-export"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP/candidate-dist" "$RUNNER_TEMP/candidate-export"
          test "$(find "$RUNNER_TEMP/candidate-dist" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum "$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
      - name: Install and prove candidate-package identity
        shell: bash
        env:
          PYTHONPATH: ""
        run: |
          python -m venv "$RUNNER_TEMP/candidate-env"
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps \
            "$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/candidate-env/bin:$PATH"
          export PYTHONNOUSERSITE=1
          "$RUNNER_TEMP/candidate-env/bin/python" -I -m se_harness identity \
            --role candidate-package \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-root "$RUNNER_TEMP/candidate-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA" \
            --entry-point "$RUNNER_TEMP/candidate-env/bin/harnessctl" \
            --require-isolated-python \
            --require-entry-point
      - name: Exercise fresh candidate-package acceptance
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" init "$RUNNER_TEMP/package-target" \
            --project-name CandidatePackage
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" doctor "$RUNNER_TEMP/package-target"
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" validate "$RUNNER_TEMP/package-target"
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" dashboard "$RUNNER_TEMP/package-target"
      - name: Exercise exact-governor to candidate upgrade outside checkout
        shell: bash
        run: |
          printf '%s  %s\n' "$GOVERNOR_WHEEL_SHA256" \
            "$RUNNER_TEMP/governor-dist/$GOVERNOR_WHEEL" | sha256sum --check -
          python -m venv "$RUNNER_TEMP/upgrade-governor-env"
          "$RUNNER_TEMP/upgrade-governor-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps \
            "$RUNNER_TEMP/governor-dist/$GOVERNOR_WHEEL"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/upgrade-governor-env/bin/harnessctl" init "$RUNNER_TEMP/upgrade-target" \
            --project-name UpgradeAcceptance
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" upgrade "$RUNNER_TEMP/upgrade-target" --apply
          "$RUNNER_TEMP/candidate-env/bin/harnessctl" doctor "$RUNNER_TEMP/upgrade-target"
      - name: Prove package acceptance made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: non-promotable-candidate-wheel
          path: ${{ runner.temp }}/candidate-dist/*.whl
          if-no-files-found: error
