# Candidate evidence for one commit: source regression, one non-promotable
# wheel built once and handed to every consumer, acceptance by the exact public
# predecessor, the N-1 to N migration rehearsal on both platforms, and the
# expiring integration package. Trigger policy (WO-CIP-001, SPEC-CIP-001
# CIP-TRG): pull requests, and pushes to main, release/** and candidate/**
# only; a newer push to the same ref cancels the older run. The predecessor
# evaluator's version, wheel, digests and migration scenario are derived once
# from the declared root (.engineering-harness.toml and .lock) by
# repository_tools.predecessor_facts in candidate-source and carried as job
# outputs (WO-CIP-003, CIP-PRE); no literal is restated here. Described in
# docs/notes/developing-se-harness.md, "Evaluator and candidate evidence".
name: SE Harness Candidate Evidence

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "candidate/**"

concurrency:
  group: candidate-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-source:
    name: Candidate source evidence
    runs-on: ubuntu-latest
    outputs:
      candidate_version: ${{ steps.candidate.outputs.version }}
      predecessor_version: ${{ steps.predecessor.outputs.version }}
      predecessor_wheel: ${{ steps.predecessor.outputs.wheel }}
      predecessor_wheel_sha256: ${{ steps.predecessor.outputs.wheel_sha256 }}
      predecessor_payload_sha256: ${{ steps.predecessor.outputs.payload_sha256 }}
      predecessor_acceptance_contract_sha256: ${{ steps.predecessor.outputs.acceptance_contract_sha256 }}
      migration_scenario: ${{ steps.predecessor.outputs.scenario }}
      migration_scenario_sha256: ${{ steps.predecessor.outputs.scenario_sha256 }}
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          version="$(python -c 'import se_harness; print(se_harness.__version__)')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Derive the predecessor evaluator facts from the declared root
        id: predecessor
        shell: bash
        run: |
          set -euo pipefail
          python -m repository_tools.predecessor_facts derive --repository . --github-output "$GITHUB_OUTPUT" --json
      - name: Qualify the complete candidate graph as candidate-controlled
        shell: bash
        run: |
          set -euo pipefail
          python -m se_harness qualify complete-candidate . \
            --candidate-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --json
      - name: Prove active evaluator surface
        run: python scripts/check_portable_release_surface.py --repository .
      - name: Run complete candidate-source regression
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Export and build the one non-promotable candidate wheel
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-export" "$RUNNER_TEMP/candidate-dist"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/candidate-export"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP/candidate-dist" "$RUNNER_TEMP/candidate-export"
          test "$(find "$RUNNER_TEMP/candidate-dist" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          (cd "$RUNNER_TEMP/candidate-dist" && sha256sum -- *.whl > SHA256SUMS)
      - name: Prove candidate source made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Hand the candidate wheel to the consuming jobs
        uses: actions/upload-artifact@v4
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist/
          if-no-files-found: error
          retention-days: 1
      - name: Retain the complete-candidate role result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-candidate-qualification
          path: ${{ runner.temp }}/complete-candidate.json
          if-no-files-found: warn

  candidate-package:
    name: Candidate package evidence
    needs: candidate-source
    runs-on: ubuntu-latest
    env:
      RELEASED_VERIFIER_VERSION: ${{ needs.candidate-source.outputs.predecessor_version }}
      RELEASED_VERIFIER_WHEEL: ${{ needs.candidate-source.outputs.predecessor_wheel }}
      RELEASED_VERIFIER_WHEEL_SHA256: ${{ needs.candidate-source.outputs.predecessor_wheel_sha256 }}
      RELEASED_VERIFIER_PAYLOAD_SHA256: ${{ needs.candidate-source.outputs.predecessor_payload_sha256 }}
      RELEASED_ACCEPTANCE_CONTRACT_SHA256: ${{ needs.candidate-source.outputs.predecessor_acceptance_contract_sha256 }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          version="$(python -c 'import se_harness; print(se_harness.__version__)')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Take the candidate wheel built by candidate-source
        uses: actions/download-artifact@v4
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist
      - name: Verify the handed-over wheel bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-dist"
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum --check --strict SHA256SUMS
      - name: Prove candidate wheel has the portable standard surface
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          python scripts/check_portable_release_surface.py --wheel "$candidate_wheel"
          python - "$candidate_wheel" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              names = archive.namelist()
          forbidden = (
              "share/se-harness/self-hosting/",
              "se_harness/governor_reconciliation.py",
              "se_harness/self_hosting.py",
              "se_harness/self_hosting_policy.py",
          )
          assert not any(any(marker in name for marker in forbidden) for name in names)
          PY
      - name: Acquire and bind the exact public predecessor as the bootstrap verifier
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASED_VERIFIER_VERSION" -a -n "$RELEASED_VERIFIER_WHEEL_SHA256" -a -n "$RELEASED_ACCEPTANCE_CONTRACT_SHA256" \
            || { echo "predecessor facts were not derived; the legacy bootstrap acceptance needs a declared contract digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/verifier-dist"
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/verifier-dist" "se-harness==$RELEASED_VERIFIER_VERSION"
          verifier_wheel="$RUNNER_TEMP/verifier-dist/$RELEASED_VERIFIER_WHEEL"
          test -f "$verifier_wheel"
          printf '%s  %s\n' "$RELEASED_VERIFIER_WHEEL_SHA256" "$verifier_wheel" | sha256sum --check -
          python -m venv "$RUNNER_TEMP/verifier-env"
          "$RUNNER_TEMP/verifier-env/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps "$verifier_wheel"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/verifier-env/bin/python" -I -m se_harness identity \
            --role released-evaluator \
            --expected-version "$RELEASED_VERIFIER_VERSION" \
            --expected-root "$RUNNER_TEMP/verifier-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --evaluator-payload-sha256 "$RELEASED_VERIFIER_PAYLOAD_SHA256" \
            --evaluator-wheel-sha256 "$RELEASED_VERIFIER_WHEEL_SHA256" \
            --entry-point "$RUNNER_TEMP/verifier-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
      - name: Retain exact-public-predecessor candidate-package bootstrap evidence
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          candidate_sha256="$(sha256sum "$candidate_wheel" | awk '{print $1}')"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/verifier-env/bin/python" -I -m se_harness accept-candidate \
            --wheel "$candidate_wheel" \
            --candidate-commit "$GITHUB_SHA" \
            --candidate-wheel-sha256 "$candidate_sha256" \
            --verifier-wheel-sha256 "$RELEASED_VERIFIER_WHEEL_SHA256" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/candidate-package-bootstrap.json"
          python - "$RUNNER_TEMP/candidate-package-bootstrap.json" "$GITHUB_SHA" \
            "$candidate_sha256" "$RELEASED_VERIFIER_WHEEL_SHA256" \
            "$RELEASED_ACCEPTANCE_CONTRACT_SHA256" "$RELEASED_VERIFIER_VERSION" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["schema"] == "se-harness-functional-acceptance-v1"
          assert value["candidate"]["commit"] == sys.argv[2]
          assert value["candidate"]["wheel_sha256"] == sys.argv[3]
          assert value["verifier"]["version"] == sys.argv[6]
          assert value["verifier"]["wheel_sha256"] == sys.argv[4]
          assert value["verifier"]["contract_sha256"] == sys.argv[5]
          assert "independence" not in value
          PY
      - name: Install candidate and prove package identity
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/candidate-env"
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$candidate_wheel"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/candidate-env/bin/python" -I -m se_harness identity \
            --role candidate-package \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-root "$RUNNER_TEMP/candidate-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA" \
            --entry-point "$RUNNER_TEMP/candidate-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
          python "$GITHUB_WORKSPACE/scripts/check_portable_release_surface.py" \
            --harnessctl "$RUNNER_TEMP/candidate-env/bin/harnessctl"
      - name: Exercise a disposable standard repository
        shell: bash
        run: |
          harnessctl="$RUNNER_TEMP/candidate-env/bin/harnessctl"
          cd "$RUNNER_TEMP"
          "$harnessctl" init candidate-target --project-name CandidatePackage
          "$harnessctl" doctor candidate-target
          "$harnessctl" validate candidate-target
          "$harnessctl" dashboard candidate-target
          "$harnessctl" upgrade candidate-target --apply
          if "$harnessctl" --help | grep -q 'reconcile-governor'; then
            echo "retired reconcile-governor command is still exposed" >&2
            exit 1
          fi
      - name: Prove package evidence made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain the legacy bootstrap result without canonical relabeling
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-package-legacy-bootstrap-${{ needs.candidate-source.outputs.predecessor_version }}
          path: ${{ runner.temp }}/candidate-package-bootstrap.json
          if-no-files-found: warn

  governance-migration:
    name: Governance migration (${{ matrix.platform }})
    needs: candidate-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            python: bin/python
          - platform: Windows
            runner: windows-latest
            python: Scripts/python.exe
    runs-on: ${{ matrix.runner }}
    outputs:
      Linux: ${{ steps.digest.outputs.Linux }}
      Windows: ${{ steps.digest.outputs.Windows }}
    env:
      PREDECESSOR_VERSION: ${{ needs.candidate-source.outputs.predecessor_version }}
      PREDECESSOR_WHEEL_SHA256: ${{ needs.candidate-source.outputs.predecessor_wheel_sha256 }}
      MIGRATION_SCENARIO: ${{ needs.candidate-source.outputs.migration_scenario }}
      MIGRATION_SCENARIO_SHA256: ${{ needs.candidate-source.outputs.migration_scenario_sha256 }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require the derived predecessor facts and the scenario they name
        shell: pwsh
        run: |
          if (-not $env:PREDECESSOR_VERSION -or -not $env:PREDECESSOR_WHEEL_SHA256 -or -not $env:MIGRATION_SCENARIO) {
            throw 'predecessor facts were not derived by candidate-source'
          }
          $scenario = Join-Path $env:GITHUB_WORKSPACE $env:MIGRATION_SCENARIO
          if (-not (Test-Path -LiteralPath $scenario -PathType Leaf)) { throw "migration scenario is missing: $env:MIGRATION_SCENARIO" }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $scenario).Hash.ToLowerInvariant()
          if ($actual -ne $env:MIGRATION_SCENARIO_SHA256) { throw 'migration scenario bytes differ from the derived digest' }
      - name: Acquire and verify the already-public predecessor
        shell: pwsh
        run: |
          $predecessorDist = Join-Path '${{ runner.temp }}' 'predecessor-dist'
          New-Item -ItemType Directory -Path $predecessorDist | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --dest $predecessorDist "se-harness==$env:PREDECESSOR_VERSION"
          $wheel = Get-ChildItem -LiteralPath $predecessorDist -Filter '*.whl'
          if ($wheel.Count -ne 1) { throw 'expected exactly one predecessor wheel' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $env:PREDECESSOR_WHEEL_SHA256) { throw 'predecessor wheel digest mismatch' }
      - name: Take the exact successor wheel built by candidate-source
        uses: actions/download-artifact@v4
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist
      - name: Verify the handed-over successor bytes
        shell: pwsh
        run: |
          $candidateDist = Join-Path '${{ runner.temp }}' 'candidate-dist'
          $wheel = Get-ChildItem -LiteralPath $candidateDist -Filter '*.whl'
          if ($wheel.Count -ne 1) { throw 'expected exactly one successor wheel' }
          $expected = (Get-Content -LiteralPath (Join-Path $candidateDist 'SHA256SUMS') | Where-Object { $_ -match [regex]::Escape($wheel.Name) })
          if (-not $expected) { throw 'SHA256SUMS does not name the successor wheel' }
          $expectedDigest = ($expected -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expectedDigest) { throw "successor wheel digest mismatch: expected $expectedDigest, got $actual" }
      - name: Install isolated local runtimes
        shell: pwsh
        run: |
          $predecessorRoot = Join-Path '${{ runner.temp }}' 'predecessor-env'
          $successorRoot = Join-Path '${{ runner.temp }}' 'successor-env'
          python -m venv $predecessorRoot
          python -m venv $successorRoot
          $predecessorPython = Join-Path $predecessorRoot '${{ matrix.python }}'
          $successorPython = Join-Path $successorRoot '${{ matrix.python }}'
          $predecessorWheel = (Get-ChildItem -LiteralPath (Join-Path '${{ runner.temp }}' 'predecessor-dist') -Filter '*.whl').FullName
          $successorWheel = (Get-ChildItem -LiteralPath (Join-Path '${{ runner.temp }}' 'candidate-dist') -Filter '*.whl').FullName
          & $predecessorPython -m pip install --disable-pip-version-check --no-index --no-deps $predecessorWheel
          & $successorPython -m pip install --disable-pip-version-check --no-index --no-deps $successorWheel
      - name: Rehearse the exact predecessor-to-successor handover twice
        shell: pwsh
        run: |
          $predecessorPython = Join-Path (Join-Path '${{ runner.temp }}' 'predecessor-env') '${{ matrix.python }}'
          $successorPython = Join-Path (Join-Path '${{ runner.temp }}' 'successor-env') '${{ matrix.python }}'
          $scenario = Join-Path $env:GITHUB_WORKSPACE $env:MIGRATION_SCENARIO
          $first = Join-Path '${{ runner.temp }}' 'migration-result-1'
          $second = Join-Path '${{ runner.temp }}' 'migration-result-2'
          Push-Location '${{ runner.temp }}'
          try {
            & $successorPython -I -m se_harness rehearse-migration $env:GITHUB_WORKSPACE `
              --scenario $scenario --predecessor-python $predecessorPython `
              --successor-python $successorPython --output $first --json
            if ($LASTEXITCODE -ne 0) { throw 'first migration rehearsal failed' }
            & $successorPython -I -m se_harness rehearse-migration $env:GITHUB_WORKSPACE `
              --scenario $scenario --predecessor-python $predecessorPython `
              --successor-python $successorPython --output $second --json
            if ($LASTEXITCODE -ne 0) { throw 'second migration rehearsal failed' }
          } finally {
            Pop-Location
          }
          $firstResult = Get-Content -Raw -LiteralPath (Join-Path $first 'governance-migration-result.json') | ConvertFrom-Json
          $secondResult = Get-Content -Raw -LiteralPath (Join-Path $second 'governance-migration-result.json') | ConvertFrom-Json
          if ($firstResult.semantic_sha256 -ne $secondResult.semantic_sha256) { throw 'migration semantic replay digest differs' }
          if ($firstResult.overall_result -ne 'pass' -or $secondResult.overall_result -ne 'pass') { throw 'migration rehearsal did not pass' }
      - name: Publish this platform's semantic digest as a job output
        id: digest
        shell: pwsh
        run: |
          $result = Get-Content -Raw -LiteralPath (Join-Path (Join-Path '${{ runner.temp }}' 'migration-result-1') 'governance-migration-result.json') | ConvertFrom-Json
          "${{ matrix.platform }}=$($result.semantic_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Retain the bounded migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-migration-${{ matrix.platform }}
          path: ${{ runner.temp }}/migration-result-*/governance-migration-result.json
          if-no-files-found: warn
      - name: Prove migration evidence made no checkout change
        shell: pwsh
        run: |
          git diff --exit-code
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw 'migration rehearsal changed the checkout' }

  integration-package-build:
    name: Build deterministic integration package
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - candidate-source
      - candidate-package
      - governance-migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      MIGRATION_DIGEST_LINUX: ${{ needs.governance-migration.outputs.Linux }}
      MIGRATION_DIGEST_WINDOWS: ${{ needs.governance-migration.outputs.Windows }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - name: Require one cross-platform migration semantic result
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MIGRATION_DIGEST_LINUX" || { echo "Linux migration digest is missing" >&2; exit 1; }
          test -n "$MIGRATION_DIGEST_WINDOWS" || { echo "Windows migration digest is missing" >&2; exit 1; }
          if [[ "$MIGRATION_DIGEST_LINUX" != "$MIGRATION_DIGEST_WINDOWS" ]]; then
            echo "cross-platform semantic mismatch: Linux=$MIGRATION_DIGEST_LINUX Windows=$MIGRATION_DIGEST_WINDOWS" >&2
            exit 1
          fi
          echo "governance migration semantic result: $MIGRATION_DIGEST_LINUX"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - name: Install exact integration build tools
        run: python -m pip install --disable-pip-version-check build==1.2.2.post1 setuptools==75.8.0 wheel==0.45.1
      - name: Build twice and stage one canonical non-promotable payload
        shell: bash
        run: |
          set -euo pipefail
          integration_args=(
            build
            --repository "$GITHUB_WORKSPACE"
            --repository-slug "$GITHUB_REPOSITORY"
            --commit "$GITHUB_SHA"
            --event "$INTEGRATION_EVENT"
            --ref "$INTEGRATION_REF"
            --workflow "$GITHUB_WORKFLOW"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --retention-days "$INTEGRATION_RETENTION_DAYS"
            --expect-build-version 1.2.2.post1
            --expect-setuptools-version 75.8.0
            --expect-wheel-version 0.45.1
            --output "$RUNNER_TEMP/integration-payload"
          )
          if [[ -n "$INTEGRATION_PR" ]]; then
            integration_args+=(--pull-request "$INTEGRATION_PR")
          fi
          python .github/scripts/build_integration_package.py "${integration_args[@]}"
      - name: Upload one-day staging bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload/
          if-no-files-found: error
          retention-days: 1

  integration-package-verify:
    name: Verify integration package (${{ matrix.platform }})
    needs: integration-package-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload
      - name: Verify and install the exact staged bytes
        shell: pwsh
        run: |
          $integrationArgs = @(
            '.github/scripts/build_integration_package.py',
            'install-test',
            '--payload', (Join-Path '${{ runner.temp }}' 'integration-payload'),
            '--checkout', $env:GITHUB_WORKSPACE,
            '--expected-commit', $env:GITHUB_SHA,
            '--expected-repository', $env:GITHUB_REPOSITORY,
            '--expected-event', $env:INTEGRATION_EVENT,
            '--expected-ref', $env:INTEGRATION_REF,
            '--expected-run-id', $env:GITHUB_RUN_ID,
            '--expected-run-attempt', $env:GITHUB_RUN_ATTEMPT,
            '--expected-workflow', $env:GITHUB_WORKFLOW,
            '--expected-retention-days', $env:INTEGRATION_RETENTION_DAYS
          )
          if ($env:INTEGRATION_PR) {
            $integrationArgs += @('--expected-pull-request', $env:INTEGRATION_PR)
          }
          python @integrationArgs
          if ($LASTEXITCODE -ne 0) { throw 'integration-package installation verification failed' }

  integration-package-retain:
    name: Retain verified integration package
    if: needs.integration-package-build.result == 'success' && needs.integration-package-verify.result == 'success'
    needs:
      - integration-package-build
      - integration-package-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload
      - name: Reverify the final payload boundary
        shell: bash
        run: |
          set -euo pipefail
          integration_args=(
            verify
            --payload "$RUNNER_TEMP/integration-payload"
            --expected-commit "$GITHUB_SHA"
            --expected-repository "$GITHUB_REPOSITORY"
            --expected-event "$INTEGRATION_EVENT"
            --expected-ref "$INTEGRATION_REF"
            --expected-run-id "$GITHUB_RUN_ID"
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
            --expected-workflow "$GITHUB_WORKFLOW"
            --expected-retention-days "$INTEGRATION_RETENTION_DAYS"
          )
          if [[ -n "$INTEGRATION_PR" ]]; then
            integration_args+=(--expected-pull-request "$INTEGRATION_PR")
          fi
          python .github/scripts/build_integration_package.py "${integration_args[@]}"
      - name: Retain the exact cross-platform-verified bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: se-harness-integration-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
