# Candidate evidence for one commit: source regression, one non-promotable
# wheel built once and handed to every consumer, acceptance by the exact public
# predecessor, the N-1 to N upgrade rehearsal on both platforms, and the
# expiring integration package. This is the only lane that qualifies the
# complete candidate graph and runs the test suite for a pull request's commit
# (WO-CIP-007, SPEC-CIP-003 CIP-ONE-002); it states each check once and leaves
# the definition of a forbidden wheel member or a retired command to
# scripts/check_portable_release_surface.py. Trigger policy (WO-CIP-001, SPEC-CIP-001
# CIP-TRG): pull requests, and pushes to main, release/** and candidate/**
# only; a newer push to the same ref cancels the older run. The predecessor
# evaluator's version, wheel and digests are derived once from the declared
# root (.engineering-harness.toml and .lock) by
# repository_tools.evaluator_facts in candidate-source and carried as job
# outputs (WO-CIP-003, CIP-PRE); no literal is restated here. The handover is
# rehearsed by repository_tools.upgrade_rehearsal (WO-ECP-010). Described in
# docs/notes/developing-se-harness.md, "Evaluator and candidate evidence".
name: SE Harness Candidate Evidence

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "candidate/**"

concurrency:
  group: candidate-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate-source:
    name: Candidate source evidence
    runs-on: ubuntu-latest
    outputs:
      candidate_version: ${{ steps.candidate.outputs.version }}
      predecessor_version: ${{ steps.predecessor.outputs.version }}
      predecessor_wheel: ${{ steps.predecessor.outputs.wheel }}
      predecessor_wheel_sha256: ${{ steps.predecessor.outputs.wheel_sha256 }}
      predecessor_payload_sha256: ${{ steps.predecessor.outputs.payload_sha256 }}
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          version="$(python -c 'import se_harness; print(se_harness.__version__)')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Derive the predecessor evaluator facts from the declared root
        id: predecessor
        shell: bash
        run: |
          set -euo pipefail
          python -m repository_tools.evaluator_facts derive --repository . --github-output "$GITHUB_OUTPUT" --json
      - name: Qualify the complete candidate graph as candidate-controlled
        shell: bash
        run: |
          set -euo pipefail
          python -m se_harness qualify complete-candidate . \
            --candidate-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/complete-candidate.json" \
            --json
      - name: Prove active evaluator surface
        run: python scripts/check_portable_release_surface.py --repository .
      - name: Restore the suite timings of the previous run
        # SPEC-TST-002 TST-HYG-019: the runner schedules classes longest-first from the
        # timings it wrote last time; the cache carries that file from run to run.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/test-timings.json
          key: test-timings-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            test-timings-${{ runner.os }}-
      - name: Run complete candidate-source regression
        run: python scripts/run_tests.py --workers 4 --scale full --timings target/test-timings.json
      - name: Export and build the one non-promotable candidate wheel
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-export" "$RUNNER_TEMP/candidate-dist"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/candidate-export"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP/candidate-dist" "$RUNNER_TEMP/candidate-export"
          test "$(find "$RUNNER_TEMP/candidate-dist" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f "$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          (cd "$RUNNER_TEMP/candidate-dist" && sha256sum -- *.whl > SHA256SUMS)
      - name: Prove candidate source made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Hand the candidate wheel to the consuming jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist/
          if-no-files-found: error
          retention-days: 1
      - name: Retain the complete-candidate role result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: complete-candidate-qualification
          path: ${{ runner.temp }}/complete-candidate.json
          if-no-files-found: warn

  candidate-package:
    name: Candidate package evidence
    needs: candidate-source
    runs-on: ubuntu-latest
    env:
      RELEASED_VERIFIER_VERSION: ${{ needs.candidate-source.outputs.predecessor_version }}
      RELEASED_VERIFIER_WHEEL: ${{ needs.candidate-source.outputs.predecessor_wheel }}
      RELEASED_VERIFIER_WHEEL_SHA256: ${{ needs.candidate-source.outputs.predecessor_wheel_sha256 }}
      RELEASED_VERIFIER_PAYLOAD_SHA256: ${{ needs.candidate-source.outputs.predecessor_payload_sha256 }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Take the candidate wheel built by candidate-source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist
      - name: Verify the handed-over wheel bytes
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/candidate-dist"
          test "$(find . -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          sha256sum --check --strict SHA256SUMS
      - name: Prove candidate wheel has the portable standard surface
        env:
          CANDIDATE_VERSION: ${{ needs.candidate-source.outputs.candidate_version }}
        shell: bash
        run: |
          # SPEC-CIP-003 CIP-ONE-003: the script's FORBIDDEN_MEMBERS is the one
          # definition of the members a portable wheel may not carry; this step
          # states no second copy of that list.
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          python scripts/check_portable_release_surface.py --wheel "$candidate_wheel"
      - name: Acquire and bind the exact public predecessor as the released verifier
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASED_VERIFIER_VERSION" -a -n "$RELEASED_VERIFIER_WHEEL_SHA256" \
            || { echo "predecessor facts were not derived; the verifier identity is unknown" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/verifier-dist"
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/verifier-dist" "se-harness==$RELEASED_VERIFIER_VERSION"
          verifier_wheel="$RUNNER_TEMP/verifier-dist/$RELEASED_VERIFIER_WHEEL"
          test -f "$verifier_wheel"
          printf '%s  %s\n' "$RELEASED_VERIFIER_WHEEL_SHA256" "$verifier_wheel" | sha256sum --check -
          python -m venv "$RUNNER_TEMP/verifier-env"
          "$RUNNER_TEMP/verifier-env/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps "$verifier_wheel"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/verifier-env/bin/python" -I -m se_harness identity \
            --role released-evaluator \
            --expected-version "$RELEASED_VERIFIER_VERSION" \
            --expected-root "$RUNNER_TEMP/verifier-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --evaluator-payload-sha256 "$RELEASED_VERIFIER_PAYLOAD_SHA256" \
            --evaluator-wheel-sha256 "$RELEASED_VERIFIER_WHEEL_SHA256" \
            --entry-point "$RUNNER_TEMP/verifier-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
      - name: Qualify the candidate package with the released verifier
        env:
          CANDIDATE_VERSION: ${{ needs.candidate-source.outputs.candidate_version }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          candidate_sha256="$(sha256sum "$candidate_wheel" | awk '{print $1}')"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          # SPEC-REB-016 REB-BFH-001: the typed operation is the only acceptance
          # path. The exact-public bootstrap fallback expired per SPEC-REB-010
          # and was removed under WO-REB-031.
          "$RUNNER_TEMP/verifier-env/bin/python" -I -m se_harness qualify candidate-package \
            --candidate-wheel "$candidate_wheel" \
            --candidate-commit "$GITHUB_SHA" \
            --candidate-wheel-sha256 "$candidate_sha256" \
            --verifier-wheel-sha256 "$RELEASED_VERIFIER_WHEEL_SHA256" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/candidate-package-qualification.json" \
            --json
          python - "$RUNNER_TEMP/candidate-package-qualification.json" <<'PY'
          import json, pathlib, sys
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["schema"] == "se-harness-release-qualification-v1"
          assert value["operation"] == "candidate-package"
          assert value["independence"] == "released-verifier"
          assert value["passed"] is True
          PY
      - name: Install candidate and prove package identity
        env:
          CANDIDATE_VERSION: ${{ needs.candidate-source.outputs.candidate_version }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/candidate-env"
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$candidate_wheel"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/candidate-env/bin/python" -I -m se_harness identity \
            --role candidate-package \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-root "$RUNNER_TEMP/candidate-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA" \
            --entry-point "$RUNNER_TEMP/candidate-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
          python "$GITHUB_WORKSPACE/scripts/check_portable_release_surface.py" \
            --harnessctl "$RUNNER_TEMP/candidate-env/bin/harnessctl"
      - name: Exercise a disposable standard repository
        shell: bash
        run: |
          # SPEC-CIP-003 CIP-ONE-004: no --help grep here. The step above runs
          # check_portable_release_surface.py --harnessctl, which refuses every
          # retired command in its FORBIDDEN_CLI, the one definition of the set.
          harnessctl="$RUNNER_TEMP/candidate-env/bin/harnessctl"
          cd "$RUNNER_TEMP"
          "$harnessctl" init candidate-target --project-name CandidatePackage
          "$harnessctl" doctor candidate-target
          "$harnessctl" validate candidate-target
          "$harnessctl" dashboard candidate-target
          "$harnessctl" upgrade candidate-target --apply
      - name: Prove package evidence made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Retain the canonical candidate-package qualification result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-package-qualification-${{ needs.candidate-source.outputs.predecessor_version }}
          path: ${{ runner.temp }}/candidate-package-qualification.json
          if-no-files-found: warn

  upgrade-rehearsal:
    name: Upgrade rehearsal (${{ matrix.platform }})
    needs: [candidate-source, candidate-package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            python: bin/python
          - platform: Windows
            runner: windows-latest
            python: Scripts/python.exe
    runs-on: ${{ matrix.runner }}
    outputs:
      Linux: ${{ steps.digest.outputs.Linux }}
      Windows: ${{ steps.digest.outputs.Windows }}
    env:
      PREDECESSOR_VERSION: ${{ needs.candidate-source.outputs.predecessor_version }}
      PREDECESSOR_WHEEL_SHA256: ${{ needs.candidate-source.outputs.predecessor_wheel_sha256 }}
      REHEARSAL_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Require the derived predecessor facts
        shell: pwsh
        run: |
          if (-not $env:PREDECESSOR_VERSION -or -not $env:PREDECESSOR_WHEEL_SHA256) {
            throw 'predecessor facts were not derived by candidate-source'
          }
      - name: Observe the rehearsal runtime (read-only)
        shell: pwsh
        run: |
          $facts = [ordered]@{
            schema = 'se-harness-rehearsal-runtime-v1'
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            head_sha = $env:REHEARSAL_HEAD_SHA
            tested_sha = $env:GITHUB_SHA
            checkout_sha = (git rev-parse HEAD)
            runner_os = $env:RUNNER_OS
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os_version = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            python_version = (python --version)
            git_version = (git --version)
            defender_status = @{ availability = 'not_applicable' }
            defender_preferences = @{ availability = 'not_applicable' }
          }
          if ($IsWindows) {
            try {
              $state = Get-MpComputerStatus -ErrorAction Stop
              $facts.defender_status = @{
                availability = 'available'
                AntivirusEnabled = $state.AntivirusEnabled
                RealTimeProtectionEnabled = $state.RealTimeProtectionEnabled
                AMRunningMode = $state.AMRunningMode
              }
            } catch {
              $facts.defender_status = @{ availability = 'unavailable'; error_type = $_.Exception.GetType().Name }
            }
            try {
              $preferences = Get-MpPreference -ErrorAction Stop
              $facts.defender_preferences = @{
                availability = 'available'
                DisableRealtimeMonitoring = $preferences.DisableRealtimeMonitoring
                ExclusionPath = @($preferences.ExclusionPath)
              }
            } catch {
              $facts.defender_preferences = @{ availability = 'unavailable'; error_type = $_.Exception.GetType().Name }
            }
          }
          $facts | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'upgrade-rehearsal-runtime.json') -Encoding utf8
      - name: Acquire and verify the already-public predecessor
        shell: pwsh
        run: |
          $predecessorDist = Join-Path '${{ runner.temp }}' 'predecessor-dist'
          New-Item -ItemType Directory -Path $predecessorDist | Out-Null
          python -m pip download --disable-pip-version-check --only-binary=:all: --no-deps `
            --dest $predecessorDist "se-harness==$env:PREDECESSOR_VERSION"
          $wheel = Get-ChildItem -LiteralPath $predecessorDist -Filter '*.whl'
          if ($wheel.Count -ne 1) { throw 'expected exactly one predecessor wheel' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $env:PREDECESSOR_WHEEL_SHA256) { throw 'predecessor wheel digest mismatch' }
      - name: Take the exact successor wheel built by candidate-source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: candidate-wheel-non-promotable-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-dist
      - name: Verify the handed-over successor bytes
        shell: pwsh
        run: |
          $candidateDist = Join-Path '${{ runner.temp }}' 'candidate-dist'
          $wheel = Get-ChildItem -LiteralPath $candidateDist -Filter '*.whl'
          if ($wheel.Count -ne 1) { throw 'expected exactly one successor wheel' }
          $expected = (Get-Content -LiteralPath (Join-Path $candidateDist 'SHA256SUMS') | Where-Object { $_ -match [regex]::Escape($wheel.Name) })
          if (-not $expected) { throw 'SHA256SUMS does not name the successor wheel' }
          $expectedDigest = ($expected -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expectedDigest) { throw "successor wheel digest mismatch: expected $expectedDigest, got $actual" }
      - name: Install isolated local runtimes
        shell: pwsh
        run: |
          $predecessorRoot = Join-Path '${{ runner.temp }}' 'predecessor-env'
          $successorRoot = Join-Path '${{ runner.temp }}' 'successor-env'
          python -m venv $predecessorRoot
          python -m venv $successorRoot
          $predecessorPython = Join-Path $predecessorRoot '${{ matrix.python }}'
          $successorPython = Join-Path $successorRoot '${{ matrix.python }}'
          $predecessorWheel = (Get-ChildItem -LiteralPath (Join-Path '${{ runner.temp }}' 'predecessor-dist') -Filter '*.whl').FullName
          $successorWheel = (Get-ChildItem -LiteralPath (Join-Path '${{ runner.temp }}' 'candidate-dist') -Filter '*.whl').FullName
          & $predecessorPython -m pip install --disable-pip-version-check --no-index --no-deps $predecessorWheel
          & $successorPython -m pip install --disable-pip-version-check --no-index --no-deps $successorWheel
      - name: Rehearse the real predecessor-to-successor upgrade twice
        shell: pwsh
        run: |
          # WO-ECP-010 (REQ-ECP-012, ECP-PRD-008): the successor's own upgrade --apply
          # against a throwaway export whose lock is the released predecessor's, judged
          # by both evaluators' doctor and by the resulting lock. No per-release
          # fixture, no network inside the rehearsal, no write to this checkout.
          $predecessorPython = Join-Path (Join-Path '${{ runner.temp }}' 'predecessor-env') '${{ matrix.python }}'
          $successorPython = Join-Path (Join-Path '${{ runner.temp }}' 'successor-env') '${{ matrix.python }}'
          $first = Join-Path '${{ runner.temp }}' 'rehearsal-result-1'
          $second = Join-Path '${{ runner.temp }}' 'rehearsal-result-2'
          python -m repository_tools.upgrade_rehearsal --repository . `
            --predecessor-python $predecessorPython --successor-python $successorPython --output $first --workspace $env:RUNNER_TEMP --timings
          if ($LASTEXITCODE -ne 0) { throw 'first upgrade rehearsal failed' }
          python -m repository_tools.upgrade_rehearsal --repository . `
            --predecessor-python $predecessorPython --successor-python $successorPython --output $second --workspace $env:RUNNER_TEMP --timings
          if ($LASTEXITCODE -ne 0) { throw 'second upgrade rehearsal failed' }
          $firstResult = Get-Content -Raw -LiteralPath (Join-Path $first 'upgrade-rehearsal-result.json') | ConvertFrom-Json
          $secondResult = Get-Content -Raw -LiteralPath (Join-Path $second 'upgrade-rehearsal-result.json') | ConvertFrom-Json
          if ($firstResult.semantic_sha256 -ne $secondResult.semantic_sha256) { throw 'upgrade rehearsal replay digest differs' }
          if ($firstResult.overall_result -ne 'pass' -or $secondResult.overall_result -ne 'pass') { throw 'upgrade rehearsal did not pass' }
      - name: Publish this platform's semantic digest as a job output
        id: digest
        shell: pwsh
        run: |
          $result = Get-Content -Raw -LiteralPath (Join-Path (Join-Path '${{ runner.temp }}' 'rehearsal-result-1') 'upgrade-rehearsal-result.json') | ConvertFrom-Json
          "${{ matrix.platform }}=$($result.semantic_sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Retain the bounded upgrade rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-rehearsal-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/rehearsal-result-*/upgrade-rehearsal-result.json
            ${{ runner.temp }}/rehearsal-result-*/upgrade-rehearsal-timing.json
            ${{ runner.temp }}/upgrade-rehearsal-runtime.json
          if-no-files-found: warn
      - name: Prove the upgrade rehearsal made no checkout change
        shell: pwsh
        run: |
          git diff --exit-code
          $status = git status --porcelain=v1 --untracked-files=all
          if ($status) { throw 'upgrade rehearsal changed the checkout' }

  integration-package-build:
    name: Build deterministic integration package
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - candidate-source
      - candidate-package
      - upgrade-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      REHEARSAL_DIGEST_LINUX: ${{ needs.upgrade-rehearsal.outputs.Linux }}
      REHEARSAL_DIGEST_WINDOWS: ${{ needs.upgrade-rehearsal.outputs.Windows }}
      # SPEC-CIP-003 CIP-ONE-007: the one statement of the integration build
      # toolchain; the install step and the --expect-*-version arguments below
      # both read these three values.
      INTEGRATION_BUILD_VERSION: 1.2.2.post1
      INTEGRATION_SETUPTOOLS_VERSION: 75.8.0
      INTEGRATION_WHEEL_VERSION: 0.45.1
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - name: Require one cross-platform upgrade rehearsal semantic result
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REHEARSAL_DIGEST_LINUX" || { echo "Linux upgrade rehearsal digest is missing" >&2; exit 1; }
          test -n "$REHEARSAL_DIGEST_WINDOWS" || { echo "Windows upgrade rehearsal digest is missing" >&2; exit 1; }
          if [[ "$REHEARSAL_DIGEST_LINUX" != "$REHEARSAL_DIGEST_WINDOWS" ]]; then
            echo "cross-platform semantic mismatch: Linux=$REHEARSAL_DIGEST_LINUX Windows=$REHEARSAL_DIGEST_WINDOWS" >&2
            exit 1
          fi
          echo "upgrade rehearsal semantic result (resulting lock, canonical): $REHEARSAL_DIGEST_LINUX"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - name: Install exact integration build tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "build==$INTEGRATION_BUILD_VERSION" \
            "setuptools==$INTEGRATION_SETUPTOOLS_VERSION" \
            "wheel==$INTEGRATION_WHEEL_VERSION"
      - name: Build twice and stage one canonical non-promotable payload
        shell: bash
        run: |
          set -euo pipefail
          integration_args=(
            build
            --repository "$GITHUB_WORKSPACE"
            --repository-slug "$GITHUB_REPOSITORY"
            --commit "$GITHUB_SHA"
            --event "$INTEGRATION_EVENT"
            --ref "$INTEGRATION_REF"
            --workflow "$GITHUB_WORKFLOW"
            --run-id "$GITHUB_RUN_ID"
            --run-attempt "$GITHUB_RUN_ATTEMPT"
            --retention-days "$INTEGRATION_RETENTION_DAYS"
            --expect-build-version "$INTEGRATION_BUILD_VERSION"
            --expect-setuptools-version "$INTEGRATION_SETUPTOOLS_VERSION"
            --expect-wheel-version "$INTEGRATION_WHEEL_VERSION"
            --output "$RUNNER_TEMP/integration-payload"
          )
          if [[ -n "$INTEGRATION_PR" ]]; then
            integration_args+=(--pull-request "$INTEGRATION_PR")
          fi
          python .github/scripts/build_integration_package.py "${integration_args[@]}"
      - name: Upload one-day staging bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload/
          if-no-files-found: error
          retention-days: 1

  integration-package-verify:
    name: Verify integration package (${{ matrix.platform }})
    needs: integration-package-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
          - platform: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload
      - name: Verify and install the exact staged bytes
        shell: pwsh
        run: |
          $integrationArgs = @(
            '.github/scripts/build_integration_package.py',
            'install-test',
            '--payload', (Join-Path '${{ runner.temp }}' 'integration-payload'),
            '--checkout', $env:GITHUB_WORKSPACE,
            '--expected-commit', $env:GITHUB_SHA,
            '--expected-repository', $env:GITHUB_REPOSITORY,
            '--expected-event', $env:INTEGRATION_EVENT,
            '--expected-ref', $env:INTEGRATION_REF,
            '--expected-run-id', $env:GITHUB_RUN_ID,
            '--expected-run-attempt', $env:GITHUB_RUN_ATTEMPT,
            '--expected-workflow', $env:GITHUB_WORKFLOW,
            '--expected-retention-days', $env:INTEGRATION_RETENTION_DAYS
          )
          if ($env:INTEGRATION_PR) {
            $integrationArgs += @('--expected-pull-request', $env:INTEGRATION_PR)
          }
          python @integrationArgs
          if ($LASTEXITCODE -ne 0) { throw 'integration-package installation verification failed' }

  integration-package-retain:
    name: Retain verified integration package
    if: needs.integration-package-build.result == 'success' && needs.integration-package-verify.result == 'success'
    needs:
      - integration-package-build
      - integration-package-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INTEGRATION_EVENT: ${{ github.event_name }}
      INTEGRATION_REF: ${{ github.ref }}
      INTEGRATION_PR: ${{ github.event.pull_request.number || '' }}
      INTEGRATION_RETENTION_DAYS: ${{ github.event_name == 'pull_request' && '3' || '14' }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          "fetch-depth": 0
          "persist-credentials": false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          "python-version": "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: integration-package-staging-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload
      - name: Reverify the final payload boundary
        shell: bash
        run: |
          set -euo pipefail
          integration_args=(
            verify
            --payload "$RUNNER_TEMP/integration-payload"
            --expected-commit "$GITHUB_SHA"
            --expected-repository "$GITHUB_REPOSITORY"
            --expected-event "$INTEGRATION_EVENT"
            --expected-ref "$INTEGRATION_REF"
            --expected-run-id "$GITHUB_RUN_ID"
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
            --expected-workflow "$GITHUB_WORKFLOW"
            --expected-retention-days "$INTEGRATION_RETENTION_DAYS"
          )
          if [[ -n "$INTEGRATION_PR" ]]; then
            integration_args+=(--expected-pull-request "$INTEGRATION_PR")
          fi
          python .github/scripts/build_integration_package.py "${integration_args[@]}"
      - name: Retain the exact cross-platform-verified bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: se-harness-integration-${{ github.sha }}
          path: ${{ runner.temp }}/integration-payload/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 3 || 14 }}
