# Plans and assesses the transition of this repository's root evaluator to the
# release the candidate would become, credential-free. Trigger policy
# (WO-CIP-001, SPEC-CIP-001 CIP-TRG): pull requests, and pushes to main,
# release/** and candidate/** only; a newer push cancels the older run.
# Described in docs/notes/developing-se-harness.md, "Advancing the root
# evaluator".
name: Governor Transition Assessment

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"
      - "candidate/**"

concurrency:
  group: governor-transition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governor-transition:
    name: Governor transition assessment
    runs-on: ubuntu-latest
    env:
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Make the default-branch base available without credentials
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
      - name: Plan the exact governor transition
        id: plan
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          python -S scripts/validate_governor_transition.py plan \
            --repository . \
            --base-revision "$BASE_REVISION" \
            --default-branch-ref "refs/remotes/origin/$DEFAULT_BRANCH" \
            --output "$RUNNER_TEMP/governor-transition-plan.json" \
            --json | tee "$RUNNER_TEMP/governor-transition-plan-result.json"
          python - "$RUNNER_TEMP/governor-transition-plan.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert value["schema"] == "se-harness-governor-transition-v1"
          assert value["passed"] is True
          transition = value["transition_required"]
          lines = [f"transition_required={str(transition).lower()}"]
          if transition:
              evaluator = value["target"]["evaluator"]
              lines.extend(
                  [
                      f"target_version={evaluator['version']}",
                      f"target_wheel={evaluator['archive_name']}",
                      f"target_archive_sha256={evaluator['archive_sha256']}",
                  ]
              )
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8", newline="\n") as stream:
              stream.write("\n".join(lines) + "\n")
          PY
      - name: Acquire and install the exact approved target evaluator
        if: steps.plan.outputs.transition_required == 'true'
        env:
          TARGET_VERSION: ${{ steps.plan.outputs.target_version }}
          TARGET_WHEEL: ${{ steps.plan.outputs.target_wheel }}
          TARGET_ARCHIVE_SHA256: ${{ steps.plan.outputs.target_archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/target-wheel"
          python -m pip download --disable-pip-version-check --no-deps \
            --only-binary=:all: --dest "$RUNNER_TEMP/target-wheel" \
            "se-harness==$TARGET_VERSION"
          wheel="$RUNNER_TEMP/target-wheel/$TARGET_WHEEL"
          test -f "$wheel"
          python - "$wheel" "$TARGET_ARCHIVE_SHA256" <<'PY'
          import hashlib
          import pathlib
          import sys

          wheel = pathlib.Path(sys.argv[1])
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == sys.argv[2]
          PY
          python -m venv "$RUNNER_TEMP/target-evaluator"
          "$RUNNER_TEMP/target-evaluator/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$wheel"
      - name: Assess the current root with the exact target governor
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TRANSITION_REQUIRED: ${{ steps.plan.outputs.transition_required }}
          TARGET_WHEEL: ${{ steps.plan.outputs.target_wheel }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repository .
            --base-revision "$BASE_REVISION"
            --default-branch-ref "refs/remotes/origin/$DEFAULT_BRANCH"
            --output "$RUNNER_TEMP/governor-transition-assessment.json"
            --json
          )
          if [[ "$TRANSITION_REQUIRED" == "true" ]]; then
            args+=(
              --evaluator-python "$RUNNER_TEMP/target-evaluator/bin/python"
              --evaluator-entry-point "$RUNNER_TEMP/target-evaluator/bin/harnessctl"
              --evaluator-wheel "$RUNNER_TEMP/target-wheel/$TARGET_WHEEL"
            )
          fi
          python -S scripts/validate_governor_transition.py assess "${args[@]}" \
            | tee "$RUNNER_TEMP/governor-transition-assessment-result.json"
      - name: Qualify transitioned root ownership with the exact target evaluator
        if: steps.plan.outputs.transition_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/target-evaluator/bin/python" -I -m se_harness \
            qualify released-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/target-released-root-qualification.json" \
            --json
      - name: Prove assessment made no checkout change
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governor-transition-assessment
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/governor-transition-plan.json
            ${{ runner.temp }}/governor-transition-plan-result.json
            ${{ runner.temp }}/governor-transition-assessment.json
            ${{ runner.temp }}/governor-transition-assessment-result.json
            ${{ runner.temp }}/target-released-root-qualification.json
