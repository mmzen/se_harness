# Standalone, manually dispatched publication of the release-bound Harness
# Explorer demonstration: the recovery path for the deployment the release
# workflow performs. It is a thin caller of the one Pages definition,
# .github/workflows/pages-publication.yml (WO-CIP-002, SPEC-CIP-001 CIP-LEG 2).
# Repository- and main-only; it takes the released record and the governance
# commit the operator expects and refuses any other. Described in
# docs/notes/harness-dashboard-publication.md.
name: Publish Dashboard Pages

on:
  workflow_dispatch:
    inputs:
      release_record:
        description: Released RLS identifier whose governance commit is demonstrated (for example RLS-SEH-012)
        required: true
        type: string
      governance_commit:
        description: Full governance commit the released record names; asserted against the record
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: se-harness-pages-demonstration
  cancel-in-progress: false

jobs:
  pages:
    name: Publish the release-bound demonstration
    if: >-
      github.repository == 'mmzen/se_harness' &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pages-publication.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      release_record: ${{ inputs.release_record }}
      governance_commit: ${{ inputs.governance_commit }}
