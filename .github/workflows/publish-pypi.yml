# The authorized last mile: resolve one released record from main, qualify
# its candidate through the one release-qualification definition
# (.github/workflows/release-qualification.yml, the same definition the
# publication rehearsal invokes), materialize the exact tag and GitHub
# Release, promote to PyPI under the pypi environment decision, publish the
# Explorer through the one Pages definition (.github/workflows/
# pages-publication.yml), and observe. Manually dispatched from main with one
# input; never cancelled in progress. Described in
# docs/notes/developing-se-harness.md, "Release sequences".
name: Publish authorized SE Harness release

on:
  workflow_dispatch:
    inputs:
      release_record:
        description: Released formal record on main (for example RLS-SEH-008)
        required: true
        type: string

permissions: {}

concurrency:
  group: se-harness-release-${{ inputs.release_record }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"

jobs:
  resolve:
    name: Resolve released authority from main
    if: github.repository == 'mmzen/se_harness' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      candidate_commit: ${{ steps.plan.outputs.candidate_commit }}
      governance_commit: ${{ steps.plan.outputs.governance_commit }}
      released_at: ${{ steps.plan.outputs.released_at }}
      wheel: ${{ steps.plan.outputs.wheel }}
      wheel_sha256: ${{ steps.plan.outputs.wheel_sha256 }}
      sdist: ${{ steps.plan.outputs.sdist }}
      sdist_sha256: ${{ steps.plan.outputs.sdist_sha256 }}
      checksums: ${{ steps.plan.outputs.checksums }}
      checksums_sha256: ${{ steps.plan.outputs.checksums_sha256 }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
      distribution_schema: ${{ steps.plan.outputs.distribution_schema }}
      build_recipe: ${{ steps.plan.outputs.build_recipe }}
      build_recipe_sha256: ${{ steps.plan.outputs.build_recipe_sha256 }}
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate the selected RLS input
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_RECORD" =~ ^RLS-[A-Z0-9-]+-[0-9]{3}$ ]]; then
            echo "release_record must be a canonical RLS identifier" >&2
            exit 1
          fi

      - name: Resolve the independently released evaluator
        id: evaluator
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/publish_dashboard.py evaluator \
            --repository "$GITHUB_WORKSPACE" \
            --release-record "${{ inputs.release_record }}" \
            --output "$RUNNER_TEMP/evaluator.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Acquire and prove the released evaluator
        env:
          EVALUATOR_VERSION: ${{ steps.evaluator.outputs.evaluator_version }}
          EVALUATOR_WHEEL: ${{ steps.evaluator.outputs.evaluator_wheel }}
          EVALUATOR_URL: ${{ steps.evaluator.outputs.evaluator_url }}
          EVALUATOR_PAYLOAD_SHA256: ${{ steps.evaluator.outputs.evaluator_payload_sha256 }}
          EVALUATOR_WHEEL_SHA256: ${{ steps.evaluator.outputs.evaluator_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/evaluator-env"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$EVALUATOR_WHEEL" "$EVALUATOR_URL"
          printf '%s  %s\n' "$EVALUATOR_WHEEL_SHA256" "$RUNNER_TEMP/$EVALUATOR_WHEEL" | sha256sum --check -
          "$RUNNER_TEMP/evaluator-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$RUNNER_TEMP/$EVALUATOR_WHEEL"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          identity_args=(
            --role released-evaluator
            --expected-version "$EVALUATOR_VERSION"
            --expected-root "$RUNNER_TEMP/evaluator-env"
            --checkout-root "$GITHUB_WORKSPACE"
            --evaluator-wheel-sha256 "$EVALUATOR_WHEEL_SHA256"
            --entry-point "$RUNNER_TEMP/evaluator-env/bin/harnessctl"
            --require-isolated-python --require-entry-point
          )
          if "$RUNNER_TEMP/evaluator-env/bin/python" -I -m se_harness identity --help 2>&1 | grep -q -- '--evaluator-payload-sha256'; then
            identity_args+=(--evaluator-payload-sha256 "$EVALUATOR_PAYLOAD_SHA256")
          fi
          "$RUNNER_TEMP/evaluator-env/bin/python" -I -m se_harness identity "${identity_args[@]}"
          cd "$GITHUB_WORKSPACE"
          python -m se_harness qualify predecessor-view "$GITHUB_WORKSPACE" \
            --release-record "${{ inputs.release_record }}" \
            --evaluator-python "$RUNNER_TEMP/evaluator-env/bin/python" \
            --output "$RUNNER_TEMP/predecessor-view-qualification.json" \
            --json

      - name: Derive one canonical release plan
        id: plan
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_release_distributions.py \
            --root "$GITHUB_WORKSPACE" \
            --require-record "$RELEASE_RECORD"
          python .github/scripts/publish_release.py resolve \
            --repository "$GITHUB_WORKSPACE" \
            --default-ref refs/heads/main \
            --release-record "$RELEASE_RECORD" \
            --output "$RUNNER_TEMP/release-plan.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain the canonical release plan
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-plan-${{ inputs.release_record }}
          path: |
            ${{ runner.temp }}/release-plan.json
            ${{ runner.temp }}/predecessor-view-qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain a bounded resolution refusal
        if: failure()
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          jq -n --arg release_record "$RELEASE_RECORD" \
            '{schema:"se-harness-release-result/v1",authority:"derived operational evidence; no formal lifecycle transition",release:{release_record:$release_record},stages:{resolution:{state:"failed"},qualification:{state:"not_run"},github:{state:"not_run"},pypi:{state:"not_run"},pages:{state:"not_run"},public_install:{state:"not_run"}}}' \
            >"$RUNNER_TEMP/release-refusal.json"

      - name: Upload the resolution refusal
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-refusal
          path: |
            ${{ runner.temp }}/release-refusal.json
            ${{ runner.temp }}/predecessor-view-qualification.json
          if-no-files-found: error
          retention-days: 90

  qualify:
    name: Rebuild and qualify exact candidate
    needs: resolve
    uses: ./.github/workflows/release-qualification.yml
    permissions:
      contents: read
    with:
      mode: release-record
      release_record: ${{ inputs.release_record }}
      require_status: released
      ref: main
      default_ref: refs/heads/main

  github_release:
    name: Materialize exact GitHub tag and release
    needs: [resolve, qualify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      state: ${{ steps.final.outputs.state }}
      url: ${{ steps.publish.outputs.url }}
      maintenance_branch: ${{ steps.maintenance.outputs.branch }}
      maintenance_state: ${{ steps.maintenance.outputs.state }}
    steps:
      - name: Check out trusted main orchestration only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download trusted plan and qualified bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: release-*-${{ inputs.release_record }}
          path: ${{ runner.temp }}/transfer

      - name: Reverify transferred bytes
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/publish_release.py verify-bundle \
            --plan "$RUNNER_TEMP/transfer/release-plan-${{ inputs.release_record }}/release-plan.json" \
            --directory "$RUNNER_TEMP/transfer/release-bundle-${{ inputs.release_record }}"

      - name: Create or verify the immutable annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CANDIDATE_COMMIT: ${{ needs.resolve.outputs.candidate_commit }}
          RELEASED_AT: ${{ needs.resolve.outputs.released_at }}
          RELEASE_RECORD: ${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          ref_json="$RUNNER_TEMP/tag-ref.json"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >"$ref_json" 2>/dev/null; then
            object_sha="$(jq -r '.object.sha' "$ref_json")"
            object_type="$(jq -r '.object.type' "$ref_json")"
            if [[ "$object_type" = tag ]]; then
              object_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '.object.sha')"
            fi
            test "$object_sha" = "$CANDIDATE_COMMIT"
          else
            tag_object="$(jq -n --arg tag "$TAG" --arg message "SE Harness $TAG ($RELEASE_RECORD)" \
              --arg object "$CANDIDATE_COMMIT" --arg date "$RELEASED_AT" \
              '{tag:$tag,message:$message,object:$object,type:"commit",tagger:{name:"SE Harness release automation",email:"release-automation@users.noreply.github.com",date:$date}}' \
              | gh api "repos/$GITHUB_REPOSITORY/git/tags" --method POST --input - --jq '.sha')"
            jq -n --arg ref "refs/tags/$TAG" --arg sha "$tag_object" '{ref:$ref,sha:$sha}' \
              | gh api "repos/$GITHUB_REPOSITORY/git/refs" --method POST --input - >/dev/null
          fi

      - name: Stage, verify, and publish the exact GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PLAN: ${{ runner.temp }}/transfer/release-plan-${{ inputs.release_record }}/release-plan.json
          BUNDLE: ${{ runner.temp }}/transfer/release-bundle-${{ inputs.release_record }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/github-release.json"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets >"$metadata" 2>/dev/null; then
            printf '{"absent":true}\n' >"$metadata"
          fi
          state="$(python .github/scripts/publish_release.py classify-github --plan "$PLAN" --metadata "$metadata" | jq -r '.state')"
          if [[ "$state" = absent ]]; then
            python .github/scripts/publish_release.py notes --plan "$PLAN" --output "$RUNNER_TEMP/release-notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
              --title "SE Harness $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" \
              "$BUNDLE/${{ needs.resolve.outputs.wheel }}" "$BUNDLE/${{ needs.resolve.outputs.sdist }}" "$BUNDLE/${{ needs.resolve.outputs.checksums }}"
          elif [[ "$state" != exact ]]; then
            echo "GitHub Release is $state; immutable state was not changed" >&2
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets >"$metadata"
          python .github/scripts/publish_release.py classify-github --plan "$PLAN" --metadata "$metadata" --output "$RUNNER_TEMP/github-state.json"
          test "$(jq -r '.state' "$RUNNER_TEMP/github-state.json")" = exact
          if [[ "$(jq -r '.isDraft' "$metadata")" = true ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          fi
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >>"$GITHUB_OUTPUT"

      - name: Record final GitHub state
        id: final
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PLAN: ${{ runner.temp }}/transfer/release-plan-${{ inputs.release_record }}/release-plan.json
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets >"$RUNNER_TEMP/final-release.json"
          python .github/scripts/publish_release.py classify-github --plan "$PLAN" --metadata "$RUNNER_TEMP/final-release.json" --github-output "$GITHUB_OUTPUT"
          test "$(jq -r '.isDraft' "$RUNNER_TEMP/final-release.json")" = false

      - name: Create or verify the maintenance line
        id: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          CANDIDATE_COMMIT: ${{ needs.resolve.outputs.candidate_commit }}
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/reconcile_maintenance_branch.py \
            --repository "$GITHUB_REPOSITORY" \
            --version "$VERSION" \
            --candidate "$CANDIDATE_COMMIT" \
            --output "$RUNNER_TEMP/maintenance-line.json" \
            --github-output "$GITHUB_OUTPUT"
          {
            printf '### Maintenance line\n\n'
            printf -- '- Branch: `%s`\n' "$(jq -r '.branch' "$RUNNER_TEMP/maintenance-line.json")"
            printf -- '- State: `%s`\n' "$(jq -r '.state' "$RUNNER_TEMP/maintenance-line.json")"
            printf -- '- Candidate: `%s`\n' "$CANDIDATE_COMMIT"
            printf -- '- Existing refs are never moved by this workflow.\n'
          } >>"$GITHUB_STEP_SUMMARY"

  pypi:
    name: Promote exact GitHub assets to PyPI
    needs: [resolve, github_release]
    if: needs.github_release.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/se-harness
    steps:
      - name: Download and verify exact final GitHub assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          WHEEL: ${{ needs.resolve.outputs.wheel }}
          WHEEL_SHA256: ${{ needs.resolve.outputs.wheel_sha256 }}
          SDIST: ${{ needs.resolve.outputs.sdist }}
          SDIST_SHA256: ${{ needs.resolve.outputs.sdist_sha256 }}
          CHECKSUMS_SHA256: ${{ needs.resolve.outputs.checksums_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          printf '%s  %s\n%s  %s\n%s  %s\n' "$WHEEL_SHA256" "release-assets/$WHEEL" "$SDIST_SHA256" "release-assets/$SDIST" "$CHECKSUMS_SHA256" "release-assets/SHA256SUMS" | sha256sum --check -
          printf '%s  %s\n%s  %s\n' "$WHEEL_SHA256" "$WHEEL" "$SDIST_SHA256" "$SDIST" | cmp --silent - release-assets/SHA256SUMS
          cp -- "release-assets/$WHEEL" "release-assets/$SDIST" dist/

      - name: Reconcile immutable PyPI version state
        id: state
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          WHEEL: ${{ needs.resolve.outputs.wheel }}
          WHEEL_SHA256: ${{ needs.resolve.outputs.wheel_sha256 }}
          SDIST: ${{ needs.resolve.outputs.sdist }}
          SDIST_SHA256: ${{ needs.resolve.outputs.sdist_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 --silent --show-error --location --output "$RUNNER_TEMP/pypi.json" --write-out '%{http_code}' "https://pypi.org/pypi/se-harness/$VERSION/json")"
          if [[ "$code" = 404 ]]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
            echo "state=absent" >>"$GITHUB_OUTPUT"
          elif [[ "$code" = 200 ]]; then
            actual="$(jq -c '[.urls[] | {filename,sha256:.digests.sha256}] | sort_by(.filename)' "$RUNNER_TEMP/pypi.json")"
            expected="$(jq -cn --arg w "$WHEEL" --arg wh "$WHEEL_SHA256" --arg s "$SDIST" --arg sh "$SDIST_SHA256" '[{filename:$s,sha256:$sh},{filename:$w,sha256:$wh}] | sort_by(.filename)')"
            test "$actual" = "$expected"
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "state=exact" >>"$GITHUB_OUTPUT"
          else
            echo "PyPI returned unexpected HTTP status $code" >&2
            exit 1
          fi

      - name: Publish exact distributions with Trusted Publishing
        if: steps.state.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 peeled commit
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
          print-hash: true

  pages:
    name: Publish release-bound Explorer from main governance
    needs: [resolve, github_release]
    if: needs.github_release.result == 'success'
    uses: ./.github/workflows/pages-publication.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      release_record: ${{ inputs.release_record }}
      governance_commit: ${{ needs.resolve.outputs.governance_commit }}

  observe:
    name: Retain public release observations
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, qualify, github_release, pypi, pages]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out trusted reporting code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download the canonical plan
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-plan-${{ inputs.release_record }}
          path: ${{ runner.temp }}/plan

      - name: Observe public install and Pages provenance
        id: public
        continue-on-error: true
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          WHEEL: ${{ needs.resolve.outputs.wheel }}
          WHEEL_SHA256: ${{ needs.resolve.outputs.wheel_sha256 }}
          SDIST: ${{ needs.resolve.outputs.sdist }}
          PAGE_URL: ${{ needs.pages.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/public-dist"
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --only-binary=:all: --no-deps --index-url https://pypi.org/simple \
            --dest "$RUNNER_TEMP/public-dist" "se-harness==$VERSION"
          public_wheel="$RUNNER_TEMP/public-dist/$WHEEL"
          test -f "$public_wheel"
          printf '%s  %s\n' "$WHEEL_SHA256" "$public_wheel" | sha256sum --check -
          python -m venv "$RUNNER_TEMP/public-env"
          "$RUNNER_TEMP/public-env/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps "$public_wheel"
          test "$("$RUNNER_TEMP/public-env/bin/harnessctl" --version)" = "$VERSION"
          payload_sha256="$(cd "$RUNNER_TEMP" && PYTHONPATH= PYTHONNOUSERSITE=1 \
            "$RUNNER_TEMP/public-env/bin/python" -I -c \
            'from se_harness.evaluator_identity import installed_payload_sha256; print(installed_payload_sha256())')"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/public-env/bin/python" -I -m se_harness qualify public-install \
            "$GITHUB_WORKSPACE" \
            --release-record "${{ inputs.release_record }}" \
            --public-wheel "$public_wheel" \
            --public-wheel-sha256 "$WHEEL_SHA256" \
            --payload-sha256 "$payload_sha256" \
            --output "$RUNNER_TEMP/public-install-qualification.json" \
            --json
          for filename in "$WHEEL" "$SDIST"; do
            curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
              -H 'Accept: application/vnd.pypi.integrity.v1+json' \
              "https://pypi.org/integrity/se-harness/$VERSION/$filename/provenance" \
              >"$RUNNER_TEMP/$filename.provenance.json"
            test "$(jq '.attestation_bundles | length' "$RUNNER_TEMP/$filename.provenance.json")" -ge 1
          done
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "${PAGE_URL%/}/publication-manifest.json" >"$RUNNER_TEMP/publication-manifest.json"
          test "$(jq -r '.release_record' "$RUNNER_TEMP/publication-manifest.json")" = "${{ inputs.release_record }}"

      - name: Emit stage-specific result
        env:
          RELEASE_RECORD: ${{ inputs.release_record }}
          QUALIFICATION_RESULT: ${{ needs.qualify.result }}
          GITHUB_RESULT: ${{ needs.github_release.result }}
          GITHUB_URL: ${{ needs.github_release.outputs.url }}
          MAINTENANCE_BRANCH: ${{ needs.github_release.outputs.maintenance_branch }}
          MAINTENANCE_STATE: ${{ needs.github_release.outputs.maintenance_state }}
          PYPI_RESULT: ${{ needs.pypi.result }}
          PYPI_URL: https://pypi.org/project/se-harness/${{ needs.resolve.outputs.version }}/
          PAGES_RESULT: ${{ needs.pages.result }}
          PAGES_URL: ${{ needs.pages.outputs.url }}
          PUBLIC_RESULT: ${{ steps.public.outcome }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg qualification "$QUALIFICATION_RESULT" --arg github "$GITHUB_RESULT" --arg github_url "$GITHUB_URL" \
            --arg maintenance_branch "$MAINTENANCE_BRANCH" --arg maintenance_state "$MAINTENANCE_STATE" \
            --arg pypi "$PYPI_RESULT" --arg pypi_url "$PYPI_URL" --arg pages "$PAGES_RESULT" --arg pages_url "$PAGES_URL" \
            --arg public_install "$PUBLIC_RESULT" --arg workflow_url "$WORKFLOW_URL" \
            '{resolution:{state:"exact",workflow_url:$workflow_url},qualification:{state:(if $qualification=="success" then "exact" else "failed" end)},github:{state:(if $github=="success" then "exact" else "failed" end),url:$github_url,maintenance_branch:(if $maintenance_branch=="" then null else $maintenance_branch end),maintenance_state:(if $maintenance_state=="" then "not_run" else $maintenance_state end)},pypi:{state:(if $pypi=="success" then "exact" else "failed" end),url:$pypi_url},pages:{state:(if $pages=="success" then "exact" else "failed" end),url:$pages_url},public_install:{state:(if $public_install=="success" then "exact" else "failed" end)}}' >"$RUNNER_TEMP/stages.json"
          python .github/scripts/publish_release.py result --plan "$RUNNER_TEMP/plan/release-plan.json" --stages "$RUNNER_TEMP/stages.json" --output "$RUNNER_TEMP/release-result.json"
          {
            printf '### SE Harness release transaction\n\n'
            printf -- '- Released record: `%s`\n' "$RELEASE_RECORD"
            printf -- '- Candidate: `%s`\n' '${{ needs.resolve.outputs.candidate_commit }}'
            printf -- '- Governance: `%s`\n' '${{ needs.resolve.outputs.governance_commit }}'
            printf -- '- Maintenance line: `%s` (`%s`)\n' "${MAINTENANCE_BRANCH:-not reached}" "${MAINTENANCE_STATE:-not_run}"
            printf -- '- GitHub / PyPI / Pages: `%s` / `%s` / `%s`\n' "$GITHUB_RESULT" "$PYPI_RESULT" "$PAGES_RESULT"
            printf -- '- Authority: derived operational evidence; no formal lifecycle transition.\n'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Retain machine-readable release result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-result-${{ inputs.release_record }}
          path: |
            ${{ runner.temp }}/release-result.json
