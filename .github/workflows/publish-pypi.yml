name: Emergency publish SE Harness 0.5.0

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: emergency-se-harness-0.5.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish immutable final 0.5.0
    if: github.repository == 'mmzen/se_harness'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/se-harness/0.5.0/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out the immutable final tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.5.0
          fetch-depth: 0
          persist-credentials: false

      - name: Select Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify the immutable source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c42bbac20f14268ef162c9628dd1d2b45ea843af"
          test "$(python -c 'import se_harness; print(se_harness.__version__)')" = "0.5.0"

      - name: Build final 0.5.0 without lifecycle controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.3.0
          python -m build --wheel --sdist --no-isolation --outdir dist .
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1
          python scripts/check_portable_release_surface.py \
            --wheel dist/se_harness-0.5.0-py3-none-any.whl
          (
            cd dist
            sha256sum se_harness-0.5.0-py3-none-any.whl se_harness-0.5.0.tar.gz >../SHA256SUMS
          )

      - name: Create the GitHub Release from the same bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir existing
            gh release download v0.5.0 --repo "$GITHUB_REPOSITORY" --dir existing
            cmp dist/se_harness-0.5.0-py3-none-any.whl existing/se_harness-0.5.0-py3-none-any.whl
            cmp dist/se_harness-0.5.0.tar.gz existing/se_harness-0.5.0.tar.gz
            cmp SHA256SUMS existing/SHA256SUMS
          else
            gh release create v0.5.0 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "SE Harness 0.5.0" \
              --notes "Final 0.5.0 release following the immutable 0.5.0a1 bootstrap and conversion of this repository to the standard released-evaluator lifecycle." \
              dist/se_harness-0.5.0-py3-none-any.whl \
              dist/se_harness-0.5.0.tar.gz \
              SHA256SUMS
          fi

      - name: Publish the exact distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 peeled commit
        with:
          packages-dir: dist/
          verify-metadata: true
          attestations: true
          print-hash: true
