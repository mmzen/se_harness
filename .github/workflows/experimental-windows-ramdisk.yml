# Disposable user-authorized diagnosis; no release or qualification claim.
name: Experimental Windows RAM disk comparison
on:
  push:
    branches: [experiment/windows-ownership-ramdisk-20260912]
permissions:
  contents: read
jobs:
  trace:
    name: Compare bounded reads on disk and RAM
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONNOUSERSITE: '1'
      PYTHONPATH: ''
      RAMDISK_BASELINE_COMMIT: 1e062e4db06b6e7131429db15b3d6b9876e600db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python313
        with:
          python-version: '3.13'
      - name: Build Microsoft TraceEvent analyzer and check candidate isolation
        shell: pwsh
        run: |
          dotnet build .github/experiments/trace-analyzer/TraceAnalyzer.csproj -c Release -o "$env:RUNNER_TEMP/trace-analyzer"
          if ($LASTEXITCODE -ne 0) { throw 'Analyzer compilation failed' }
          python -I -B .github/experiments/check-reader-diff.py
          if ($LASTEXITCODE -ne 0) { throw 'Unexpected candidate source changes' }
          "RAMDISK_PY313=$(Split-Path -Parent '${{ steps.python313.outputs.python-path }}')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          wpr -profiles .github/experiments/Ownership.wprp
          if ($LASTEXITCODE -ne 0) { throw 'Profile validation failed' }
      - name: Prepare verified RAM disk
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath 'R:\') { throw 'R: is already in use' }
          $driverDirectory = Join-Path $env:RUNNER_TEMP 'ramdisk-driver'
          New-Item -ItemType Directory -Path $driverDirectory | Out-Null
          $archive = Join-Path $driverDirectory 'imdisk.zip'
          Invoke-WebRequest -Uri 'https://static.ltr-data.se/files/imdisk.zip' -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne 'B799B5C8DB1C49BB4BBE58BF6D2C5146D9CA0D35DF282F30189A5AE38BAA7859') { throw 'Driver package changed' }
          $files = Join-Path $driverDirectory 'files'
          Expand-Archive -LiteralPath $archive -DestinationPath $files
          $driver = Join-Path $files 'sys/amd64/imdisk.sys'
          $signature = Get-AuthenticodeSignature -LiteralPath $driver
          Write-Host ('DRIVER_SIGNATURE ' + $signature.Status + ' ' + $signature.SignerCertificate.Subject)
          if ($signature.Status -ne 'Valid') { throw 'Driver signature is not valid' }
          $inf = Join-Path $files 'imdisk.inf'
          $install = Start-Process -FilePath "$env:SystemRoot\System32\rundll32.exe" -ArgumentList @('setupapi.dll,InstallHinfSection', 'DefaultInstall', '132', $inf) -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Driver installation failed' }
          Start-Service imdisk
          $imdisk = Join-Path $env:SystemRoot 'System32/imdisk.exe'
          & $imdisk -a -t vm -s 4G -m R: -p '/fs:ntfs /q /y /v:OWNERSHIP_RAM'
          if ($LASTEXITCODE -ne 0) { throw 'RAM disk creation failed' }
          if (-not (Test-Path -LiteralPath 'R:\')) { throw 'RAM disk is not mounted' }
          'RAMDISK_CREATED=1' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $imdisk -l -m R:
          & fsutil fsinfo volumeinfo R:
          if ($LASTEXITCODE -ne 0) { throw 'NTFS inspection failed' }
          $os = Get-CimInstance Win32_OperatingSystem
          $defender = Get-MpComputerStatus
          $preferences = Get-MpPreference
          [ordered]@{image=$env:ImageOS;image_version=$env:ImageVersion;os=$os.Caption;memory_kb=$os.TotalVisibleMemorySize;free_memory_kb=$os.FreePhysicalMemory;real_time_protection=$defender.RealTimeProtectionEnabled;antivirus=$defender.AntivirusEnabled;exclusions=@($preferences.ExclusionPath);driver_version=(Get-Item -LiteralPath $driver).VersionInfo.FileVersion} | ConvertTo-Json -Depth 4
          Get-Partition | Select-Object DiskNumber,PartitionNumber,DriveLetter,Size | ConvertTo-Json
          Get-CimInstance Win32_PageFileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage,PeakUsage | ConvertTo-Json
      - name: Original reader on normal disk
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/experiments/windows-ownership-trace.ps1" -Storage disk -Variant baseline'
      - name: Chunked reader on normal disk
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/experiments/windows-ownership-trace.ps1" -Storage disk -Variant chunked'
      - name: Chunked reader on RAM disk
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/experiments/windows-ownership-trace.ps1" -Storage ramdisk -Variant chunked'
      - name: Original reader on RAM disk
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        shell: pwsh
        run: '& "$env:GITHUB_WORKSPACE/.github/experiments/windows-ownership-trace.ps1" -Storage ramdisk -Variant baseline'
      - name: Dismount this experiment RAM disk
        if: ${{ always() && env.RAMDISK_CREATED == '1' }}
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:GITHUB_WORKSPACE
          & "$env:SystemRoot/System32/imdisk.exe" -d -m R:
          if ($LASTEXITCODE -ne 0) { throw 'RAM disk dismount failed' }
