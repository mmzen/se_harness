name: Reusable SE Harness Self-Hosting Assurance

on:
  workflow_call:
    inputs:
      governor-version:
        required: true
        type: string
      governor-tag:
        required: true
        type: string
      governor-wheel:
        required: true
        type: string
      governor-url:
        required: true
        type: string
      governor-wheel-sha256:
        required: true
        type: string
      governor-release-record:
        required: true
        type: string
      candidate-version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  governor:
    name: Released governor
    runs-on: ubuntu-latest
    env:
      GOVERNOR_VERSION: ${{ inputs.governor-version }}
      GOVERNOR_TAG: ${{ inputs.governor-tag }}
      GOVERNOR_WHEEL: ${{ inputs.governor-wheel }}
      GOVERNOR_URL: ${{ inputs.governor-url }}
      GOVERNOR_WHEEL_SHA256: ${{ inputs.governor-wheel-sha256 }}
      GOVERNOR_RELEASE_RECORD: ${{ inputs.governor-release-record }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Acquire and prove the exact released governor
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/governor-env"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$GOVERNOR_WHEEL" "$GOVERNOR_URL"
          printf '%s  %s\n' "$GOVERNOR_WHEEL_SHA256" "$RUNNER_TEMP/$GOVERNOR_WHEEL" |
            sha256sum --check -
          "$RUNNER_TEMP/governor-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$RUNNER_TEMP/$GOVERNOR_WHEEL"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/governor-env/bin/python" -I -m se_harness identity \
            --role governor \
            --expected-version "$GOVERNOR_VERSION" \
            --expected-root "$RUNNER_TEMP/governor-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --governor-wheel-sha256 "$GOVERNOR_WHEEL_SHA256" \
            --entry-point "$RUNNER_TEMP/governor-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
      - name: Prove same-version governor integrity in a disposable target
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/governor-env/bin/harnessctl" init governor-target --project-name GovernorIntegrity
          "$RUNNER_TEMP/governor-env/bin/harnessctl" doctor governor-target
      - uses: actions/upload-artifact@v4
        with:
          name: released-governor-wheel
          path: ${{ runner.temp }}/${{ inputs.governor-wheel }}
          if-no-files-found: error

  candidate-source:
    name: Candidate source evidence
    needs: governor
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
      PYTHONNOUSERSITE: "1"
      PYTHONPATH: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove candidate-source identity
        run: >-
          python -m se_harness identity
          --role candidate-source
          --expected-version "$CANDIDATE_VERSION"
          --expected-root "$GITHUB_WORKSPACE"
          --checkout-root "$GITHUB_WORKSPACE"
          --candidate-commit "$GITHUB_SHA"
      - name: Select the pull-request work order
        if: github.event_name == 'pull_request'
        id: work_order
        shell: bash
        run: |
          work_order="$(python scripts/select_harness_work_order.py --event "$GITHUB_EVENT_PATH")"
          printf 'work_order=%s\n' "$work_order" >> "$GITHUB_OUTPUT"
      - name: Review preflight
        if: github.event_name == 'pull_request'
        env:
          HARNESS_WORK_ORDER: ${{ steps.work_order.outputs.work_order }}
        run: python -m se_harness preflight . --work-order "$HARNESS_WORK_ORDER" --phase review
      - name: Run complete candidate-source regression
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate candidate artifact graph
        run: python scripts/validate_engineering_artifacts.py --root .
      - name: Validate repository release-distribution policy
        run: python scripts/validate_release_distributions.py --root .
      - name: Prove candidate source made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  candidate-package:
    name: Candidate package evidence
    needs: candidate-source
    runs-on: ubuntu-latest
    env:
      GOVERNOR_VERSION: ${{ inputs.governor-version }}
      GOVERNOR_WHEEL: ${{ inputs.governor-wheel }}
      GOVERNOR_WHEEL_SHA256: ${{ inputs.governor-wheel-sha256 }}
      CANDIDATE_VERSION: ${{ inputs.candidate-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: released-governor-wheel
          path: ${{ runner.temp }}/governor-dist
      - name: Export and build one non-promotable candidate wheel
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/candidate-export" "$RUNNER_TEMP/candidate-dist"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/candidate-export"
          python -m pip wheel --disable-pip-version-check --no-deps \
            --wheel-dir "$RUNNER_TEMP/candidate-dist" "$RUNNER_TEMP/candidate-export"
          test "$(find "$RUNNER_TEMP/candidate-dist" -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
      - name: Prove candidate wheel excludes repository release policy
        shell: bash
        run: |
          candidate_wheel="$(find "$RUNNER_TEMP/candidate-dist" -maxdepth 1 -name '*.whl')"
          python scripts/check_portable_release_surface.py --wheel "$candidate_wheel"
      - name: Install candidate and prove package identity
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/candidate-env"
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/candidate-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$candidate_wheel"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          "$RUNNER_TEMP/candidate-env/bin/python" -I -m se_harness identity \
            --role candidate-package \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-root "$RUNNER_TEMP/candidate-env" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --candidate-commit "$GITHUB_SHA" \
            --entry-point "$RUNNER_TEMP/candidate-env/bin/harnessctl" \
            --require-isolated-python --require-entry-point
          python "$GITHUB_WORKSPACE/scripts/check_portable_release_surface.py" \
            --harnessctl "$RUNNER_TEMP/candidate-env/bin/harnessctl"
      - name: Run released-governor black-box acceptance
        shell: bash
        run: |
          printf '%s  %s\n' "$GOVERNOR_WHEEL_SHA256" \
            "$RUNNER_TEMP/governor-dist/$GOVERNOR_WHEEL" | sha256sum --check -
          python -m venv "$RUNNER_TEMP/acceptance-governor-env"
          "$RUNNER_TEMP/acceptance-governor-env/bin/python" -m pip install \
            --disable-pip-version-check --no-deps "$RUNNER_TEMP/governor-dist/$GOVERNOR_WHEEL"
          cd "$RUNNER_TEMP"
          export PYTHONNOUSERSITE=1 PYTHONPATH=
          candidate_wheel="$RUNNER_TEMP/candidate-dist/se_harness-$CANDIDATE_VERSION-py3-none-any.whl"
          candidate_wheel_sha256="$(sha256sum "$candidate_wheel" | cut -d ' ' -f 1)"
          "$RUNNER_TEMP/acceptance-governor-env/bin/harnessctl" accept-candidate \
            --wheel "$candidate_wheel" \
            --candidate-commit "$GITHUB_SHA" \
            --candidate-wheel-sha256 "$candidate_wheel_sha256" \
            --governor-wheel-sha256 "$GOVERNOR_WHEEL_SHA256" \
            --checkout-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/governor-acceptance.json"
      - name: Prove package acceptance made no checkout change
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        with:
          name: released-governor-acceptance
          path: ${{ runner.temp }}/governor-acceptance.json
          if-no-files-found: error
