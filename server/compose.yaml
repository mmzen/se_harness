services:
  graph:
    image: memgraph/memgraph@sha256:4710bee1ab5b47599876e30f17ae1679d0bbb2262d84dc06641521fecb7c89ce
    platform: linux/amd64
    command: ["--storage-mode=IN_MEMORY_TRANSACTIONAL", "--isolation-level=SNAPSHOT_ISOLATION", "--storage-snapshot-interval-sec=300", "--storage-wal-enabled=true", "--storage-wal-file-flush-every-n-tx=1", "--data-recovery-on-startup=true", "--query-execution-timeout-sec=5", "--telemetry-enabled=false"]
    volumes:
      - graph_data:/var/lib/memgraph
    networks: [private]
  service:
    image: ${HAG_SERVICE_IMAGE:?Build and select the exact local candidate image}
    platform: linux/amd64
    ports: ["127.0.0.1:${HAG_HTTP_PORT:-8080}:8080"]
    volumes:
      - type: volume
        source: source_data
        target: /source
        read_only: true
      - type: bind
        source: ${HAG_CONFIG_DIRECTORY:?Select external non-secret configuration}
        target: /run/config
        read_only: true
    secrets: [sandbox_credentials]
    networks: [private, client]
    depends_on: [graph]
secrets:
  sandbox_credentials:
    file: ${HAG_CREDENTIAL_FILE:?Select a temporary sandbox credential file}
volumes:
  graph_data:
  source_data:
    external: true
    name: ${HAG_SOURCE_VOLUME:?Stage the immutable reference snapshot into a dedicated source volume}
networks:
  private:
    internal: true
  client: {}
