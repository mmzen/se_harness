[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "se-harness-hosted-sandbox"
version = "0.1.0.dev1"
description = "Private, single-project SE Harness draft sandbox"
requires-python = ">=3.13"
dependencies = ["mcp==1.30.0", "neo4j==6.3.1", "jsonschema==4.26.0", "lark==1.3.1", "uvicorn==0.54.0"]

[project.scripts]
harness-hosted = "hosted_artifact_graph.__main__:main"

[tool.setuptools.packages.find]
include = ["hosted_artifact_graph*"]

[tool.setuptools.data-files]
"share/se-harness-hosted/contracts" = ["contracts/*.json", "contracts/*.cypher"]
