[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "se-harness"
version = "0.2.2"
description = "A repository-native, specification-driven software-engineering harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/mmzen/se_harness"
Repository = "https://github.com/mmzen/se_harness"
Issues = "https://github.com/mmzen/se_harness/issues"
Releases = "https://github.com/mmzen/se_harness/releases"

[project.scripts]
harnessctl = "se_harness.cli:main"

[tool.setuptools.packages.find]
include = ["se_harness*"]

[tool.setuptools.data-files]
"share/se-harness/templates/repository/standard" = [
  "templates/repository/standard/.engineering-harness.toml.tpl",
  "templates/repository/standard/AGENTS.md.fragment",
  "templates/repository/standard/CLAUDE.md.fragment",
  "templates/repository/standard/ENGINEERING_HARNESS.md.tpl",
  "templates/repository/standard/gitignore.fragment",
]
"share/se-harness/templates/repository/standard/docs/engineering" = [
"templates/repository/standard/docs/engineering/DECISION_RIGHTS.md",
"templates/repository/standard/docs/engineering/QUALITY_GATES.md",
  "templates/repository/standard/docs/engineering/README.md.seed",
"templates/repository/standard/docs/engineering/REPOSITORY_CONTEXT.md.seed",
  "templates/repository/standard/docs/engineering/TRACEABILITY.md",
  "templates/repository/standard/docs/engineering/WORKFLOW.md",
]
"share/se-harness/templates/repository/standard/docs/engineering/templates" = ["templates/repository/standard/docs/engineering/templates/*"]
"share/se-harness/templates/repository/standard/scripts" = [
  "templates/repository/standard/scripts/artifact_layout_registry.py",
  "templates/repository/standard/scripts/check_engineering_harness.ps1",
  "templates/repository/standard/scripts/check_engineering_harness.sh",
"templates/repository/standard/scripts/generate_harness_dashboard.py",
  "templates/repository/standard/scripts/select_harness_work_order.py",
"templates/repository/standard/scripts/validate_engineering_artifacts.py",
]
"share/se-harness/templates/repository/standard/scripts/harness_explorer" = ["templates/repository/standard/scripts/harness_explorer/*"]
"share/se-harness/templates/repository/standard/.github" = ["templates/repository/standard/.github/PULL_REQUEST_TEMPLATE.md.seed"]
"share/se-harness/templates/repository/standard/.github/workflows" = ["templates/repository/standard/.github/workflows/engineering-harness.yml"]
"share/se-harness/self-hosting" = ["self_hosting/*"]

[tool.unittest]
start-directory = "tests"
